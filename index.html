<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>木马</title>
<script>
  try {
    const fromBook = sessionStorage.getItem("open-book") === "1" || new URLSearchParams(location.search).get("open") === "1";
    if (fromBook && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("opening");
    }
  } catch (err) {}
</script>
<style>
  :root {
    --bone: #f3e6d2;
    --bone-deep: #6b4e38;
    --field: #f6ead8;
    --earth: #3d332c;
    --ink: #2c241c;
    --ochre: #9a7040;
    --clay: #8a5344;
    --ochre-soft: #c4a36a;
    --clay-soft: #c48978;
    --v-yuandian: var(--ochre);
    --v-nuolan: var(--clay);
    --inkline: var(--ink);
    --ease-out: cubic-bezier(.22, .72, .18, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }
  html.opening { overflow-x: hidden; }
  html.opening body {
    perspective: 2200px;
    perspective-origin: 8% 46%;
  }
  html.opening .wrap {
    transform-origin: left center;
    transform: rotateY(64deg);
    opacity: 0.7;
    will-change: transform;
  }
  html.leaving { overflow-x: hidden; }
  html.leaving body {
    perspective: 2200px;
    perspective-origin: 8% 46%;
  }
  html.leaving .wrap {
    transform-origin: left center;
    will-change: transform;
  }

  body {
    min-height: 100%;
    background-color: #5c4030;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    padding: clamp(16px, 4vw, 48px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body.is-busy { cursor: wait; }

  .page-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: min(1180px, 100%);
    padding: clamp(16px, 2.6vw, 26px);
    background: var(--bone);
    border: 1px solid var(--ink);
    border-radius: 0;
    box-shadow:
      0 0 0 6px rgba(122, 91, 62, 0.18),
      0 18px 40px rgba(48, 32, 18, 0.16);
  }
  .slab-marks {
    position: absolute;
    inset: 7px;
    pointer-events: none;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'><path d='M0-7 1.1-1.1 7 0 1.1 1.1 0 7-1.1 1.1-7 0-1.1-1.1Z' fill='%237a5b3e'/></svg>") 0 0 / 12px 12px no-repeat,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'><path d='M0-7 1.1-1.1 7 0 1.1 1.1 0 7-1.1 1.1-7 0-1.1-1.1Z' fill='%237a5b3e'/></svg>") 100% 0 / 12px 12px no-repeat,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'><path d='M0-7 1.1-1.1 7 0 1.1 1.1 0 7-1.1 1.1-7 0-1.1-1.1Z' fill='%237a5b3e'/></svg>") 0 100% / 12px 12px no-repeat,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'><path d='M0-7 1.1-1.1 7 0 1.1 1.1 0 7-1.1 1.1-7 0-1.1-1.1Z' fill='%237a5b3e'/></svg>") 100% 100% / 12px 12px no-repeat;
    opacity: 0.65;
  }

  .bench {
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2.5vw, 22px);
  }

  .horse-zone { display: flex; flex-direction: column; align-items: stretch; gap: 12px; min-width: 0; }

  .board {
    width: 100%;
    position: relative;
    padding: 18px 18px 14px;
    background: var(--field);
    border: 1px solid var(--ink);
    box-shadow: none;
    transition: transform .28s var(--ease-out);
  }
  .board.reject { animation: board-nudge .42s ease; }
  @keyframes board-nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .ticks {
    position: absolute;
    inset: 5px;
    pointer-events: none;
    opacity: 0.5;
    background:
      linear-gradient(var(--ink), var(--ink)) 0 0 / 12px 1px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 0 0 / 1px 12px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 100% 0 / 12px 1px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 100% 0 / 1px 12px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 0 100% / 12px 1px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 0 100% / 1px 12px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 100% 100% / 12px 1px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 100% 100% / 1px 12px no-repeat;
  }
  .frieze {
    height: 16px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='42' height='16' viewBox='0 0 42 16'><path d='M21 14C21 14 17 6 21 2C25 6 21 14 21 14M21 12C15 8 13 4 15 2M21 12C27 8 29 4 27 2' fill='none' stroke='%236b5344' stroke-width='1.1'/></svg>") center / 42px 16px repeat-x;
  }

  .stage {
    position: relative;
    isolation: isolate;
    width: 100%;
    margin: 0 auto;
    aspect-ratio: 649 / 916;
    touch-action: none;
    border-radius: 2px;
    outline: 2px solid transparent;
    outline-offset: 4px;
    transition: outline-color .2s ease, box-shadow .2s ease;
  }
  .stage.target-ok {
    outline-color: rgba(28, 36, 34, 0.45);
    box-shadow: none;
  }
  .stage.target-no { outline-color: rgba(42, 40, 38, 0.2); }
  .stage.can-lift { cursor: pointer; }

  .stage.can-lift {
    outline: 1px dashed rgba(42, 40, 38, 0.35);
    outline-offset: -2px;
  }

  /* 只占自己的外接框；空槽由矢量画布绘制。 */
  .part {
    position: absolute;
    background: no-repeat 0 0 / 100% 100%;
    transition: filter .2s ease;
  }
  .part.hover {
    filter: brightness(1.12) saturate(1.05);
    z-index: 2;
  }
  .part[data-state="filled"].hover { filter: brightness(1.08); }

  .seams-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }
  .slot-hint {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
  }

  .sequence {
    display: flex;
    gap: 6px;
    width: 100%;
    padding: 0 4px;
  }
  .seq-cell {
    flex: 1;
    height: 5px;
    border-radius: 1px;
    background: rgba(42, 40, 38, 0.22);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset;
    opacity: 0.35;
    transform: scaleY(0.85);
    transition: opacity .25s ease, transform .25s var(--ease-out), background-color .25s ease;
  }
  .seq-cell.on {
    opacity: 1;
    transform: scaleY(1);
  }
  .seq-cell.yuandian.on { background: var(--v-yuandian); }
  .seq-cell.nuolan.on { background: var(--v-nuolan); }

  /* 只渐变透明度：模糊半径逐帧变化很费 GPU，叠上透明度看起来一样。 */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 16;
    background: rgba(44, 36, 28, 0.32);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .6s ease, visibility 0s linear .6s;
  }
  .veil.on {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .6s ease;
  }

  .scroll {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 20;
    width: min(1080px, 92vw);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .scroll:empty { display: none; }
  .scroll-piece { position: relative; height: min(460px, 56vh); }
  .sheet {
    height: 100%;
    overflow: hidden;
    background: var(--field);
    box-shadow: 0 24px 50px rgba(18, 24, 22, 0.38);
    animation: unfurl 2.6s cubic-bezier(.22, .7, .2, 1) both;
  }
  .sheet img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 62%;
    display: block;
  }
  .roll {
    position: absolute;
    top: -10px;
    bottom: -10px;
    width: 18px;
    border-radius: 9px;
    z-index: 2;
    background: linear-gradient(90deg, #3a2a1c, #e6d2b0 40%, #8a6844 50%, #e6d2b0 60%, #3a2a1c);
    box-shadow: 0 8px 16px rgba(48, 32, 18, 0.28);
  }
  .roll-l { left: 0; }
  /* 轨道宽度 = 卷轴宽 - 轴宽，translateX(100%) 正好停在右缘，全程只动 transform。 */
  .roll-track {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 18px;
    z-index: 2;
    pointer-events: none;
    animation: roll-r 2.6s cubic-bezier(.22, .7, .2, 1) both;
  }
  .roll-r { left: 0; }
  .shut {
    position: absolute;
    top: -14px;
    right: -14px;
    z-index: 3;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--ink);
    background: var(--field);
    color: var(--ink);
    font: 22px/1 "Songti SC", "STSong", Palatino, serif;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 4px 14px rgba(20, 10, 4, 0.28);
    transition: transform .15s ease, background .15s ease;
  }
  .shut:hover { background: #f8f0e4; transform: scale(1.06); }
  .shut:active { transform: scale(0.96); }
  .shut[hidden] { display: none; }
  .shut:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .scroll.open .sheet { animation: none; }
  .scroll.open .roll-track {
    animation: none;
    transform: translateX(100%);
  }
  @keyframes unfurl { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes roll-r { from { transform: translateX(0); } to { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .veil { animation: none; transition: none; }
    .roll-track {
      animation: none;
      transform: translateX(100%);
    }
  }

  /* 拼块的 z-index 会一直累加，只让它在托盘内部比较，不越过卷轴。 */
  .tray {
    isolation: isolate;
    padding: 12px 12px 14px;
    background: var(--earth);
    border: 1px solid var(--ink);
    box-shadow:
      inset 0 3px 12px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
  }
  .tray.yuandian {
    box-shadow:
      inset 0 3px 12px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      inset 3px 0 0 var(--ochre-soft);
  }
  .tray.nuolan {
    box-shadow:
      inset 0 3px 12px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      inset -3px 0 0 var(--clay-soft);
  }
  .pile {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    height: clamp(220px, 36vh, 420px);
    min-height: 200px;
  }
  .shard {
    position: absolute;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: grab;
    touch-action: none;
    -webkit-appearance: none;
    appearance: none;
    overflow: visible;
    background: transparent;
    filter:
      drop-shadow(0 2px 0 rgba(28, 22, 16, 0.9))
      drop-shadow(0 6px 7px rgba(10, 8, 6, 0.45));
    transform-origin: 50% 50%;
    transition: filter .18s ease;
  }
  .shard.held, .shard.dragging {
    filter:
      drop-shadow(0 3px 0 rgba(28, 22, 16, 0.9))
      drop-shadow(0 18px 18px rgba(10, 8, 6, 0.5));
  }
  .shard-surface {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .shard:focus-visible { outline: 2px solid var(--field); outline-offset: 3px; }
  .shard.held { cursor: grab; }
  .shard.dragging {
    cursor: grabbing;
    will-change: transform;
  }
  body.dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }

  .tray-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 520px) {
    .board { width: 100%; }
    .sequence { gap: 4px; }
    .pile { height: clamp(180px, 32vh, 260px); }
  }
  @media (min-width: 900px) {
    .bench {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(280px, 2.2fr) minmax(180px, 1fr);
      align-items: stretch;
      gap: 14px;
    }
    .tray-row {
      display: contents;
    }
    .tray {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .tray.yuandian { order: 1; }
    .horse-zone { order: 2; min-width: 0; }
    .tray.nuolan { order: 3; }
    .pile { height: clamp(420px, 72vh, 820px); min-height: 420px; }
  }
</style>
</head>
<body>
<img class="page-field" src="assets/field.svg?v=2" alt="" />
<div class="wrap">
  <span class="slab-marks" aria-hidden="true"></span>
  <div class="bench">
    <div class="horse-zone">
      <div class="board" id="board">
        <span class="ticks" aria-hidden="true"></span>
        <div class="stage" id="stage" tabindex="0" role="application" aria-label="木马拼图"></div>
      </div>
      <div class="frieze" aria-hidden="true"></div>
      <div class="sequence" id="sequence" aria-hidden="true"></div>
    </div>
    <div class="tray-row">
      <div class="tray yuandian" data-version="yuandian">
        <div class="pile" id="pileYuandian"></div>
      </div>
      <div class="tray nuolan" data-version="nuolan">
        <div class="pile" id="pileNuolan"></div>
      </div>
    </div>
  </div>
</div>
<div class="veil" id="veil"></div>
<div class="scroll" id="finds"></div>

<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/masks/horse.js?v=30"></script>
<script src="assets/endings.js?v=1"></script>
<script>
const HORSE = window.HORSE;
const NATURAL = { w: HORSE.W, h: HORSE.H };
const BOXES = HORSE.boxes;
const SLOT_N = Object.keys(BOXES).length;
const KEYS = ["yuandian", "nuolan"];
const ASSET_V = "?v=30";
const SEAT_RATIO = 0.4;
const SAMPLE_STEP = 4;
const DRAG_THRESHOLD = 6;
const REVEAL_DELAY = 1100;
const HINT_COLOR = { yuandian: "rgba(154, 112, 64, 0.95)", nuolan: "rgba(138, 83, 68, 0.95)" };

const BEATS = [
  { yuandian: "木马进城，夜色里潜入，胜利以荣耀收束。", nuolan: "进城之后是残酷的战斗，奥德修斯颓废。", file: { yuandian: "情节1_特洛伊_原典_v2.jpg", nuolan: "情节1_特洛伊_改编_v1.jpg" } },
  { yuandian: "十二船，伊斯罗斯，九天风暴，食莲，独眼与 Nobody。", nuolan: "沉重的十二船。中间剥落。独眼夺食，逃脱，惹怒。", file: { yuandian: "情节2_回程1_原典_v2.jpg", nuolan: "情节2_回程1_改编_v4.jpg" } },
  { yuandian: "风袋把船打回去。巨人砸船，只剩一艘。喀耳刻救回被变成猪的人。", nuolan: "剥落。钢铁巨人砸船。变猪，谈判，再变回来。", file: { yuandian: "情节3_回程2_原典_v2.jpg", nuolan: "情节3_回程2_改编_v3.jpg" } },
  { yuandian: "冥界先知。塞壬与蜂蜡。斯库拉吞下六人。", nuolan: "冥界里阿伽门农的亡魂，残酷真相，然后是赎罪的决心。塞壬与斯库拉仍在。", file: { yuandian: "情节4_回程3_原典_v2.jpg", nuolan: "情节4_回程3_改编_v2.jpg" } },
  { yuandian: "赫利俄斯的牛，漂流九天。卡吕普索的七年。费埃克斯人。睡梦中回到伊塔卡。", nuolan: "阿波罗的牛，宙斯发怒。忘忧莲七年。离岛，为救子再回。", file: { yuandian: "情节5_回程4_原典_v3.jpg", nuolan: "情节5_回程4_改编_v2.jpg" } },
  { yuandian: "珀涅罗珀与子守住城邦。乞丐归来，杀死求婚者，团聚成为传奇。", nuolan: "儿子寻父。父子扮成乞丐同归，杀死求婚者。与妻子自我流放，赎罪。", file: { yuandian: "情节6_伊塔卡_原典_v2.jpg", nuolan: "情节6_伊塔卡_改编_v2.jpg" } }
];

const stage = document.getElementById("stage");
const boardEl = document.getElementById("board");
const wrap = document.querySelector(".wrap");
const sequence = document.getElementById("sequence");
const veil = document.getElementById("veil");
const finds = document.getElementById("finds");
const piles = {
  yuandian: document.getElementById("pileYuandian"),
  nuolan: document.getElementById("pileNuolan")
};
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

let held = null;
let busy = false;
let dragging = false;
let zTop = 0;
let shards = [];
let hovered = 0;
let stageMode = "";
let revealTimer = 0;
const filled = {};
const order = [];
const partEls = {};

function motionOk() {
  return !!window.gsap && !reduceMotion.matches;
}

function pixelRatio() {
  return Math.min(3, window.devicePixelRatio || 1);
}

function stageRect() {
  return stage.getBoundingClientRect();
}

function scaleOf(rect) {
  return rect.width > 0 ? rect.width / NATURAL.w : 1;
}

function clamp01(v) {
  return Math.min(1, Math.max(0, v));
}

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

const isSlot = i => i >= 1 && i <= SLOT_N;

function countYuandian() {
  return order.filter(item => item.key === "yuandian").length;
}

function stillURL(beat, key) {
  return encodeURI("stills/" + BEATS[beat].file[key]);
}

function prefetchEnding(tier) {
  if (document.querySelector('link[data-end="' + tier + '"]')) return;
  const link = document.createElement("link");
  link.rel = "prefetch";
  link.href = endingImage(tier);
  link.dataset.end = tier;
  document.head.appendChild(link);
}

/* 分区表：点击检测、残片实心判断、落位覆盖率都只查这一张表，不读画布像素。 */

const regionLabels = decodeRuns(HORSE.runs, NATURAL.w * NATURAL.h);

function decodeRuns(runs, size) {
  const out = new Uint8Array(size);
  let at = 0;
  for (let i = 0; i < runs.length; i += 2) {
    const n = runs[i + 1];
    if (runs[i]) out.fill(runs[i], at, at + n);
    at += n;
  }
  return out;
}

function labelAt(x, y) {
  x = Math.floor(x);
  y = Math.floor(y);
  if (x < 0 || y < 0 || x >= NATURAL.w || y >= NATURAL.h) return 0;
  return regionLabels[y * NATURAL.w + x];
}

function regionAt(clientX, clientY, rect = stageRect()) {
  if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return 0;
  return labelAt(
    (clientX - rect.left) / rect.width * NATURAL.w,
    (clientY - rect.top) / rect.height * NATURAL.h
  );
}

const slotSamples = {};
for (let slot = 1; slot <= SLOT_N; slot++) {
  const box = BOXES[slot];
  const pts = [];
  for (let y = box.y + (SAMPLE_STEP >> 1); y < box.y + box.h; y += SAMPLE_STEP) {
    for (let x = box.x + (SAMPLE_STEP >> 1); x < box.x + box.w; x += SAMPLE_STEP) {
      if (regionLabels[y * NATURAL.w + x] === slot) pts.push(x, y);
    }
  }
  slotSamples[slot] = Int16Array.from(pts);
}

// off 是残片相对正确位置的偏移（自然坐标）。
function coverRatio(piece, off) {
  const pts = slotSamples[piece.slot];
  if (!pts.length) return 0;
  const dx = Math.round(off.ox);
  const dy = Math.round(off.oy);
  let hit = 0;
  for (let i = 0; i < pts.length; i += 2) {
    if (labelAt(pts[i] + dx, pts[i + 1] + dy) === piece.slot) hit++;
  }
  return hit / (pts.length / 2);
}

/* 残片图 */

function pieceSrc(slot, key) {
  return "assets/masks/piece_" + key + "_" + slot + ".png" + ASSET_V;
}

const pieceImgs = {};
KEYS.forEach(key => {
  for (let slot = 1; slot <= SLOT_N; slot++) {
    const img = new Image();
    img.decoding = "async";
    img.src = pieceSrc(slot, key);
    pieceImgs[key + "_" + slot] = img;
    const ready = () => paintShard(shards.find(s => s.slot === slot && s.key === key));
    if (img.decode) img.decode().then(ready, ready);
    else img.addEventListener("load", ready, { once: true });
  }
});

function paintShard(piece) {
  if (!piece || !piece.el) return;
  const img = pieceImgs[piece.key + "_" + piece.slot];
  if (!img.complete || !img.naturalWidth) return;
  const canvas = piece.el.firstElementChild;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

// 按「棋盘比例 × 像素比」出图，拖到马身上放大时不糊。
function sizeSurface(piece, k) {
  const canvas = piece.el.firstElementChild;
  const box = BOXES[piece.slot];
  const res = Math.max(piece.scale, k) * pixelRatio();
  const w = Math.max(2, Math.round(box.w * res));
  const h = Math.max(2, Math.round(box.h * res));
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w;
  canvas.height = h;
  paintShard(piece);
}

let surfaceTimer = 0;
function queueSurfaceSizes() {
  window.clearTimeout(surfaceTimer);
  surfaceTimer = window.setTimeout(() => {
    if (dragging) {
      queueSurfaceSizes();
      return;
    }
    const k = scaleOf(stageRect());
    shards.forEach(piece => {
      if (!piece.placed && piece.el) sizeSurface(piece, k);
    });
  }, 160);
}

function shardEl(piece) {
  if (piece.el) return piece.el;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "shard " + piece.key;
  btn.setAttribute("aria-label", piece.key === "yuandian" ? "原典残片" : "改编残片");
  const canvas = document.createElement("canvas");
  canvas.className = "shard-surface";
  btn.appendChild(canvas);
  piece.el = btn;
  bindShard(btn, piece);
  return btn;
}

/* 托盘 */

const MAX_BOX = Object.values(BOXES).reduce(
  (m, b) => ({ w: Math.max(m.w, b.w), h: Math.max(m.h, b.h) }),
  { w: 0, h: 0 }
);

// 所有残片共用一个比例，大小关系与马身一致。
function pileScale(w, h, k) {
  return Math.min(k * 0.62, (w * 0.98) / MAX_BOX.w, (h * 0.55) / MAX_BOX.h);
}

function measurePile(pileEl) {
  const tray = pileEl.parentElement;
  const rect = pileEl.getBoundingClientRect();
  let w = rect.width || pileEl.clientWidth || (tray ? tray.clientWidth - 24 : 0);
  let h = rect.height || pileEl.clientHeight;
  if (w < 48) w = tray ? Math.max(160, tray.clientWidth - 24) : 200;
  if (h < 120) h = 360;
  return { w, h };
}

function scatter() {
  shards.forEach(piece => {
    if (piece.el) piece.el.remove();
  });
  const next = [];
  // 同侧内部打乱，左右版本不混。
  KEYS.forEach(key => {
    shuffle(Array.from({ length: SLOT_N }, (_, i) => i + 1)).forEach((slot, n) => {
      next.push({
        id: next.length,
        slot,
        key,
        placed: false,
        el: null,
        sized: false,
        rx: clamp01(0.5 + (Math.random() - 0.5) * 0.7),
        ry: clamp01((n + 0.5) / SLOT_N + (Math.random() - 0.5) * 0.08),
        rot: Math.random() * 50 - 25,
        z: next.length + 1
      });
    });
  });
  shards = next;
  zTop = shards.length;
}

function pose(btn, piece) {
  btn.style.transform = held === piece
    ? "rotate(0deg) scale(1.06)"
    : "rotate(" + piece.rot + "deg) scale(1)";
}

function raise(btn, piece) {
  piece.z = ++zTop;
  btn.style.zIndex = String(piece.z);
  btn.style.transform = "rotate(0deg) scale(1.08)";
}

// 先读完所有尺寸再统一写样式，避免读写交错反复排版。
function renderPile() {
  const k = scaleOf(stageRect());
  const sides = {};
  KEYS.forEach(key => {
    const { w, h } = measurePile(piles[key]);
    sides[key] = { w, h, scale: pileScale(w, h, k) };
  });
  shards.forEach(piece => {
    const btn = shardEl(piece);
    if (piece.placed) {
      btn.remove();
      return;
    }
    const side = sides[piece.key];
    const box = BOXES[piece.slot];
    piece.scale = side.scale;
    piece.dw = box.w * side.scale;
    piece.dh = box.h * side.scale;
    const pile = piles[piece.key];
    if (btn.parentElement !== pile) pile.appendChild(btn);
    const s = btn.style;
    s.position = "";
    s.transition = "";
    s.left = piece.rx * Math.max(0, side.w - piece.dw) + "px";
    s.top = piece.ry * Math.max(0, side.h - piece.dh) + "px";
    s.width = piece.dw + "px";
    s.height = piece.dh + "px";
    s.zIndex = String(piece.z);
    btn.classList.toggle("held", held === piece);
    btn.setAttribute("aria-pressed", String(held === piece));
    pose(btn, piece);
    if (!piece.sized) {
      piece.sized = true;
      sizeSurface(piece, k);
    }
  });
  queueSurfaceSizes();
}

/* 棋盘 */

let seamsCanvas = null;
let hintCanvas = null;
let hintSlot = 0;
let hintKey = "";
let hintTween = null;
const regionPaths = {};

function makeLayer(className) {
  const canvas = document.createElement("canvas");
  canvas.className = className;
  canvas.setAttribute("aria-hidden", "true");
  stage.appendChild(canvas);
  return canvas;
}

function buildStage() {
  for (let slot = 1; slot <= SLOT_N; slot++) {
    const box = BOXES[slot];
    const el = document.createElement("div");
    el.className = "part";
    el.dataset.part = slot;
    el.dataset.state = "empty";
    el.style.left = box.x / NATURAL.w * 100 + "%";
    el.style.top = box.y / NATURAL.h * 100 + "%";
    el.style.width = box.w / NATURAL.w * 100 + "%";
    el.style.height = box.h / NATURAL.h * 100 + "%";
    stage.appendChild(el);
    partEls[slot] = el;
  }
  hintCanvas = makeLayer("slot-hint");
  seamsCanvas = makeLayer("seams-canvas");
}

// 相邻点中点为端点、原点为控制点的二次曲线，闭合成平滑轮廓。只建一次。
function smoothPath(pts) {
  const path = new Path2D();
  const n = pts.length;
  if (n < 3) return path;
  path.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % n];
    path.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
  }
  path.closePath();
  return path;
}

function pathsFor(slot) {
  if (!regionPaths[slot]) regionPaths[slot] = (HORSE.regions[slot] || []).map(smoothPath);
  return regionPaths[slot];
}

// 画布贴合舞台并换算到自然坐标，线宽要除回 s。
function fitLayer(canvas, rect) {
  const dpr = pixelRatio();
  const w = Math.round(rect.width * dpr);
  const h = Math.round(rect.height * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const s = w / NATURAL.w;
  ctx.setTransform(s, 0, 0, h / NATURAL.h, 0, 0);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  return { ctx, s, dpr };
}

function paintSeams(rect = stageRect()) {
  if (!seamsCanvas || rect.width < 2 || rect.height < 2) return;
  const { ctx, s, dpr } = fitLayer(seamsCanvas, rect);
  ctx.fillStyle = "rgba(138, 116, 88, 0.46)";
  for (let slot = 1; slot <= SLOT_N; slot++) {
    if (!filled[slot]) pathsFor(slot).forEach(p => ctx.fill(p));
  }
  ctx.strokeStyle = "rgba(44, 36, 28, 0.92)";
  ctx.lineWidth = Math.max(1.35 * dpr, HORSE.stroke * s * 0.55) / s;
  for (let slot = 1; slot <= SLOT_N; slot++) {
    pathsFor(slot).forEach(p => ctx.stroke(p));
  }
}

function drawSlotHint(slot, key, rect = stageRect()) {
  if (rect.width < 2 || rect.height < 2) return;
  const { ctx, s, dpr } = fitLayer(hintCanvas, rect);
  ctx.fillStyle = HINT_COLOR[key];
  ctx.strokeStyle = HINT_COLOR[key];
  ctx.lineWidth = Math.max(16 * dpr, 18) / s;
  pathsFor(slot).forEach(p => {
    ctx.fill(p);
    ctx.stroke(p);
  });
}

function showSlotHint(slot, key) {
  if (hintSlot === slot && hintKey === key) return;
  hintSlot = slot;
  hintKey = key;
  drawSlotHint(slot, key);
  hintCanvas.style.willChange = "opacity";
  if (!motionOk()) {
    hintCanvas.style.opacity = "0.72";
    return;
  }
  gsap.killTweensOf(hintCanvas);
  hintTween = gsap.fromTo(hintCanvas, { opacity: 0.38 }, {
    opacity: 0.78,
    duration: 0.68,
    ease: "sine.inOut",
    yoyo: true,
    repeat: -1
  });
}

function hideSlotHint() {
  if (!hintSlot) return;
  hintSlot = 0;
  hintKey = "";
  if (hintTween) { hintTween.kill(); hintTween = null; }
  if (!motionOk()) {
    hintCanvas.style.opacity = "0";
    hintCanvas.style.willChange = "auto";
    return;
  }
  gsap.to(hintCanvas, {
    opacity: 0,
    duration: 0.22,
    ease: "power1.out",
    onComplete: () => { hintCanvas.style.willChange = "auto"; }
  });
}

function flashSlot(slot, key) {
  hintSlot = 0;
  hintKey = "";
  if (hintTween) { hintTween.kill(); hintTween = null; }
  if (!motionOk()) {
    hintCanvas.style.opacity = "0";
    hintCanvas.style.willChange = "auto";
    return;
  }
  drawSlotHint(slot, key);
  hintCanvas.style.willChange = "opacity";
  gsap.killTweensOf(hintCanvas);
  gsap.fromTo(hintCanvas, { opacity: 0.85 }, {
    opacity: 0,
    duration: 0.62,
    ease: "power2.out",
    onComplete: () => { hintCanvas.style.willChange = "auto"; }
  });
}

function snapToContour(el, seat) {
  const k = scaleOf(stageRect());
  const x = seat ? seat.ox * k : 0;
  const y = seat ? seat.oy * k : 0;
  if (!motionOk() || (Math.abs(x) < 0.6 && Math.abs(y) < 0.6)) return;
  el.style.willChange = "transform";
  gsap.killTweensOf(el);
  gsap.fromTo(el, { x, y }, {
    x: 0,
    y: 0,
    duration: 0.48,
    ease: "power3.out",
    onComplete: () => {
      el.style.willChange = "auto";
      gsap.set(el, { clearProps: "transform" });
    }
  });
}

function paint(slot, key, seat) {
  const el = partEls[slot];
  el.dataset.state = "filled";
  el.dataset.fill = key;
  el.style.backgroundImage = 'url("' + pieceSrc(slot, key) + '")';
  paintSeams();
  flashSlot(slot, key);
  snapToContour(el, seat);
}

function clearPart(slot) {
  const el = partEls[slot];
  el.dataset.state = "empty";
  delete el.dataset.fill;
  el.style.backgroundImage = "";
  if (window.gsap) {
    gsap.killTweensOf(el);
    gsap.set(el, { clearProps: "transform" });
  }
  el.style.willChange = "auto";
}

/* 窗口或托盘尺寸变化：合并到下一帧统一处理。 */

let layoutFrame = 0;
function scheduleLayout() {
  if (layoutFrame) return;
  layoutFrame = window.requestAnimationFrame(() => {
    layoutFrame = 0;
    const rect = stageRect();
    paintSeams(rect);
    if (hintSlot) drawSlotHint(hintSlot, hintKey, rect);
    if (!busy && !dragging) renderPile();
  });
}

/* 进度条 */

function buildSequence() {
  sequence.replaceChildren(...Array.from({ length: SLOT_N }, () => {
    const cell = document.createElement("span");
    cell.className = "seq-cell";
    return cell;
  }));
}

function updateSequence() {
  [...sequence.children].forEach((cell, n) => {
    cell.className = n < order.length ? "seq-cell on " + order[n].key : "seq-cell";
  });
}

function setBusyState(on) {
  busy = on;
  document.body.classList.toggle("is-busy", on);
}

function rejectBoard() {
  boardEl.classList.remove("reject");
  void boardEl.offsetWidth;
  boardEl.classList.add("reject");
  boardEl.addEventListener("animationend", () => boardEl.classList.remove("reject"), { once: true });
}

/* 画卷与结局 */

let unfurlAbort = null;
let leavingForEnd = false;
let endTimer = 0;

function endUnfurlListen() {
  if (unfurlAbort) unfurlAbort.abort();
  unfurlAbort = null;
}

function goEnding() {
  if (leavingForEnd) return;
  leavingForEnd = true;
  endUnfurlListen();
  window.clearTimeout(endTimer);
  const href = "ending.html?tier=" + encodeURIComponent(endingTier(countYuandian(), SLOT_N)) + "&open=1";
  if (!motionOk()) {
    location.href = href;
    return;
  }
  document.documentElement.classList.add("leaving");
  veil.style.transition = "none";
  gsap.set(wrap, { transformOrigin: "left center" });
  gsap.timeline({ onComplete: () => { location.href = href; } })
    .to([finds, veil], { autoAlpha: 0, duration: 0.42, ease: "power2.in" }, 0)
    .to(wrap, { rotationY: -112, duration: 0.9, ease: "power2.in" }, 0.1);
}

function closeScroll() {
  if (order.length >= SLOT_N) {
    goEnding();
    return;
  }
  endUnfurlListen();
  setBusyState(false);
  finds.replaceChildren();
  finds.className = "scroll";
  veil.classList.remove("on");
  scheduleLayout();
}

function reveal(beat, key) {
  revealTimer = 0;
  finds.className = "scroll";
  const piece = document.createElement("div");
  piece.className = "scroll-piece";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  const img = document.createElement("img");
  img.src = stillURL(beat, key);
  img.alt = "";
  sheet.appendChild(img);
  const left = document.createElement("i");
  left.className = "roll roll-l";
  const track = document.createElement("span");
  track.className = "roll-track";
  const right = document.createElement("i");
  right.className = "roll roll-r";
  track.appendChild(right);
  const shut = document.createElement("button");
  shut.type = "button";
  shut.className = "shut";
  shut.hidden = true;
  shut.setAttribute("aria-label", "关闭");
  shut.textContent = "×";
  shut.addEventListener("click", closeScroll);
  piece.append(left, sheet, track, shut);
  finds.replaceChildren(piece);
  veil.classList.add("on");
  endUnfurlListen();
  unfurlAbort = new AbortController();
  let settled = false;
  let holding = false;
  let settleTimer = 0;
  const finish = () => {
    if (settled || holding || !finds.contains(piece)) return;
    settled = true;
    window.clearTimeout(settleTimer);
    endUnfurlListen();
    if (order.length >= SLOT_N) {
      window.clearTimeout(endTimer);
      endTimer = window.setTimeout(goEnding, motionOk() ? 680 : 0);
      return;
    }
    shut.hidden = false;
  };
  const release = () => {
    window.removeEventListener("pointerup", release);
    window.removeEventListener("pointercancel", release);
    holding = false;
    finish();
  };
  // 展开途中按下就直接铺满，松手后再出现关闭按钮，避免同一下点到它。
  const skip = e => {
    if (settled || holding || !finds.contains(piece)) return;
    if (e.button != null && e.button !== 0) return;
    finds.classList.add("open");
    holding = true;
    window.addEventListener("pointerup", release);
    window.addEventListener("pointercancel", release);
  };
  if (reduceMotion.matches) {
    finish();
    return;
  }
  sheet.addEventListener("animationend", finish, { once: true });
  settleTimer = window.setTimeout(finish, 3200);
  veil.addEventListener("pointerdown", skip, { signal: unfurlAbort.signal });
}

/* 放上 / 取下 */

function put(slot, piece, seat) {
  if (busy || !isSlot(slot) || slot !== piece.slot || filled[slot] || piece.placed) return;
  piece.placed = true;
  filled[slot] = piece.key;
  order.push({ slot, key: piece.key });
  held = null;
  setBusyState(true);
  const beat = order.length - 1;
  const key = piece.key;
  // 吸附动画期间先把这一幕下载好，画卷展开时不留白。
  new Image().src = stillURL(beat, key);
  paint(slot, key, seat);
  renderPile();
  updateSequence();
  hover(0);
  if (order.length === SLOT_N) prefetchEnding(endingTier(countYuandian(), SLOT_N));
  revealTimer = window.setTimeout(() => reveal(beat, key), REVEAL_DELAY);
}

function take(slot) {
  if (busy || !filled[slot]) return;
  const piece = shards.find(s => s.slot === slot && s.placed);
  if (!piece) return;
  piece.placed = false;
  delete filled[slot];
  const at = order.findIndex(item => item.slot === slot);
  if (at >= 0) order.splice(at, 1);
  held = null;
  clearPart(slot);
  paintSeams();
  renderPile();
  updateSequence();
}

/* 棋盘悬停：只有结果变化才改 class */

function hover(i) {
  let next = 0;
  if (held) next = i === held.slot && !filled[i] ? i : 0;
  else next = isSlot(i) && filled[i] ? i : 0;
  if (next !== hovered) {
    if (hovered) partEls[hovered].classList.remove("hover");
    hovered = next;
    if (hovered) partEls[hovered].classList.add("hover");
  }
  syncStageHint(i);
}

function syncStageHint(i) {
  let mode = "";
  if (!busy) {
    if (held) mode = i === held.slot && !filled[i] ? "target-ok" : isSlot(i) ? "target-no" : "";
    else if (isSlot(i) && filled[i]) mode = "can-lift";
  }
  if (mode === stageMode) return;
  if (stageMode) stage.classList.remove(stageMode);
  stageMode = mode;
  if (mode) stage.classList.add(mode);
}

stage.addEventListener("mousemove", e => {
  hover(busy ? 0 : regionAt(e.clientX, e.clientY));
});
stage.addEventListener("mouseleave", () => hover(0));
stage.addEventListener("click", e => {
  if (busy) return;
  const i = regionAt(e.clientX, e.clientY);
  if (held) put(i, held);
  else if (filled[i]) take(i);
});

/* 拖动 */

// 残片是不规则形状：点到空白处要落到下面那块。
function solidAt(piece, clientX, clientY) {
  const btn = piece.el;
  const w = btn.offsetWidth;
  const h = btn.offsetHeight;
  if (!w || !h) return false;
  const r = btn.getBoundingClientRect();
  const rad = -((held === piece ? 0 : piece.rot) * Math.PI) / 180;
  const dx = clientX - (r.left + r.width / 2);
  const dy = clientY - (r.top + r.height / 2);
  const lx = dx * Math.cos(rad) - dy * Math.sin(rad) + w / 2;
  const ly = dx * Math.sin(rad) + dy * Math.cos(rad) + h / 2;
  if (lx < 0 || ly < 0 || lx >= w || ly >= h) return false;
  const box = BOXES[piece.slot];
  return labelAt(box.x + lx / w * box.w, box.y + ly / h * box.h) === piece.slot;
}

function shardUnder(clientX, clientY, except) {
  return shards
    .filter(p => p !== except && !p.placed && p.el && p.el.isConnected)
    .sort((a, b) => b.z - a.z)
    .find(p => solidAt(p, clientX, clientY));
}

function bindShard(btn, piece) {
  let start = null;
  let frame = 0;
  let lastX = 0;
  let lastY = 0;

  // 放大到棋盘比例后，按住的那一点仍留在指针下；返回相对正确位置的偏移。
  const place = (clientX, clientY) => {
    const rect = stageRect();
    const k = scaleOf(rect);
    const box = BOXES[piece.slot];
    const cx = clientX - (start.fx - 0.5) * box.w * k;
    const cy = clientY - (start.fy - 0.5) * box.h * k;
    btn.style.left = (cx - piece.dw / 2) + "px";
    btn.style.top = (cy - piece.dh / 2) + "px";
    return {
      ox: (cx - rect.left) / k - (box.x + box.w / 2),
      oy: (cy - rect.top) / k - (box.y + box.h / 2)
    };
  };

  const tick = () => {
    frame = 0;
    if (!start || !start.floated) return;
    const off = place(lastX, lastY);
    if (filled[piece.slot] || coverRatio(piece, off) < SEAT_RATIO) hideSlotHint();
    else showSlotHint(piece.slot, piece.key);
  };

  const float = () => {
    start.floated = true;
    dragging = true;
    document.body.classList.add("dragging");
    btn.classList.add("dragging");
    document.body.appendChild(btn);
    btn.style.position = "fixed";
    btn.style.zIndex = "14";
    piece.z = ++zTop;
    btn.style.transition = "transform .22s var(--ease-out), filter .18s ease";
    btn.style.transform = "rotate(0deg) scale(" + (scaleOf(stageRect()) / piece.scale) + ")";
  };

  const endDrag = () => {
    if (frame) window.cancelAnimationFrame(frame);
    frame = 0;
    start = null;
    dragging = false;
    document.body.classList.remove("dragging");
    btn.classList.remove("dragging");
  };

  btn._grab = e => {
    const r = btn.getBoundingClientRect();
    start = {
      x: e.clientX,
      y: e.clientY,
      moved: false,
      floated: false,
      fx: clamp01((e.clientX - r.left) / r.width),
      fy: clamp01((e.clientY - r.top) / r.height)
    };
    raise(btn, piece);
    btn.setPointerCapture(e.pointerId);
  };

  btn.addEventListener("pointerdown", e => {
    if (busy || e.button > 0 || piece.placed) return;
    if (!solidAt(piece, e.clientX, e.clientY)) {
      e.preventDefault();
      const below = shardUnder(e.clientX, e.clientY, piece);
      if (below) below.el._grab(e);
      return;
    }
    btn._grab(e);
  });

  btn.addEventListener("pointermove", e => {
    if (!start) return;
    lastX = e.clientX;
    lastY = e.clientY;
    if (!start.moved) {
      if (Math.hypot(lastX - start.x, lastY - start.y) <= DRAG_THRESHOLD) return;
      start.moved = true;
    }
    if (!start.floated) {
      float();
      place(lastX, lastY);
    }
    if (!frame) frame = window.requestAnimationFrame(tick);
  });

  btn.addEventListener("pointerup", e => {
    if (!start) return;
    const { moved, floated } = start;
    let seat = null;
    if (floated) {
      const off = place(e.clientX, e.clientY);
      if (!filled[piece.slot] && coverRatio(piece, off) >= SEAT_RATIO) seat = off;
    }
    endDrag();
    if (!moved) {
      hideSlotHint();
      held = held === piece ? null : piece;
      renderPile();
      syncStageHint(0);
      return;
    }
    hover(0);
    if (seat) {
      put(piece.slot, piece, seat);
      return;
    }
    hideSlotHint();
    if (isSlot(regionAt(e.clientX, e.clientY))) rejectBoard();
    renderPile();
  });

  btn.addEventListener("pointercancel", () => {
    endDrag();
    hideSlotHint();
    renderPile();
    hover(0);
  });
}

/* 重开 */

function reset() {
  endUnfurlListen();
  window.clearTimeout(revealTimer);
  window.clearTimeout(endTimer);
  revealTimer = 0;
  order.length = 0;
  Object.keys(filled).forEach(k => delete filled[k]);
  held = null;
  setBusyState(false);
  hideSlotHint();
  veil.classList.remove("on");
  finds.replaceChildren();
  finds.className = "scroll";
  for (let slot = 1; slot <= SLOT_N; slot++) clearPart(slot);
  scatter();
  renderPile();
  updateSequence();
  hover(0);
  paintSeams();
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && veil.classList.contains("on")) {
    e.preventDefault();
    closeScroll();
    return;
  }
  if (e.key !== "r" && e.key !== "R") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (!busy && !dragging && !leavingForEnd) reset();
});

/* 翻页进场；从结局页按「返回」回来时页面可能来自缓存，停在翻走的那一帧，要复原。 */

function consumeOpenFlag() {
  try { sessionStorage.removeItem("open-book"); } catch (err) {}
  try {
    const url = new URL(location.href);
    if (!url.searchParams.has("open")) return;
    url.searchParams.delete("open");
    const query = url.searchParams.toString();
    history.replaceState(null, "", url.pathname + (query ? "?" + query : "") + url.hash);
  } catch (err) {}
}

function openFromBook() {
  const root = document.documentElement;
  consumeOpenFlag();
  if (!root.classList.contains("opening")) return;
  if (!motionOk()) {
    root.classList.remove("opening");
    return;
  }
  gsap.fromTo(wrap, {
    rotationY: 64,
    opacity: 0.7,
    transformOrigin: "left center"
  }, {
    rotationY: 0,
    opacity: 1,
    duration: 0.85,
    ease: "power3.out",
    onComplete: () => {
      gsap.set(wrap, { clearProps: "transform,opacity" });
      wrap.style.willChange = "auto";
      root.classList.remove("opening");
    }
  });
}

window.addEventListener("pageshow", e => {
  if (!e.persisted || !leavingForEnd) return;
  leavingForEnd = false;
  document.documentElement.classList.remove("leaving");
  veil.style.transition = "";
  if (window.gsap) {
    gsap.killTweensOf([wrap, finds, veil]);
    gsap.set([wrap, finds, veil], { clearProps: "transform,transformOrigin,opacity,visibility" });
  }
  reset();
});

function boot() {
  openFromBook();
  buildSequence();
  buildStage();
  scatter();
  renderPile();
  updateSequence();
  paintSeams();
  window.addEventListener("resize", scheduleLayout);
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(scheduleLayout);
    [stage, piles.yuandian, piles.nuolan].forEach(el => observer.observe(el));
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
