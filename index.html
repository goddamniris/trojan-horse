<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>拖拽拼装特洛伊木马</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #dde2dc;
    --ink:   #2f3432;
    --body:  #4c5550;
    --sage:  #6f7b74;
    --sand:  #c4c1b3;
    --card:  #f3f4f1;
    --line:  #c9cdc6;
    --empty: #bfc6be;

    /* 占位色，素材未定 */
    --v-yuandian: #b9a888;
    --v-nuolan:   #3e4744;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Sans 3", "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 28px 30px 40px;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  header {
    border-bottom: 1px solid var(--sand);
    padding-bottom: 14px;
    text-align: center;
  }
  h1 {
    font-family: "Playfair Display", "Songti SC", serif;
    font-size: 26px;
    font-weight: 600;
  }
  .sub { margin-top: 5px; font-size: 14px; color: var(--body); }

  .main { margin-top: 28px; }

  /* ---- 马 ---- */

  .board {
    background: #d5dad3;
    border: 1px solid var(--sand);
    padding: 20px 16px 16px;
    max-width: 620px;
    margin: 0 auto;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    aspect-ratio: 649 / 916;
    touch-action: manipulation;
  }
  .part {
    position: absolute;
    inset: 0;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
    transition: filter .18s ease;
  }
  .part[data-role="structure"]  { opacity: .8; }
  .part.hover                   { filter: brightness(1.12); }

  /* 空槽位就是这匹马本身，分块靠接缝看出来。 */
  .part[data-state="empty"] {
    background-color: transparent;
    background-image: var(--art);
  }

  /* 两个版本的占位色 + 质感 */
  .tex-yuandian {
    background-color: var(--v-yuandian);
    background-image: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.22) 0 1px,
      transparent 1px 5px
    );
  }
  .tex-nuolan {
    background-color: var(--v-nuolan);
    background-image: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.10) 0 1px,
      transparent 1px 4px
    );
  }

  .seams {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: url("assets/masks/seams.png") no-repeat;
    background-size: 100% 100%;
    opacity: .4;
  }

  .board-foot {
    max-width: 520px;
    margin: 12px auto 0;
    padding-top: 8px;
    border-top: 1px solid var(--sand);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--sage);
  }

  /* ---- 下面的拼块 ---- */

  .tray { margin-top: 26px; text-align: center; }
  .tip { font-size: 13px; color: var(--body); }

  .versions {
    margin: 12px auto 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    max-width: 360px;
  }
  .vbtn {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    font: inherit;
    color: inherit;
    cursor: grab;
    text-align: left;
    touch-action: none;
  }
  .vbtn:hover { border-color: var(--sage); }
  .vbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .vbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .vdot {
    width: 20px; height: 20px; flex: 0 0 20px;
    border: 1px solid rgba(47,52,50,.3);
  }

  .ghost {
    position: fixed;
    z-index: 50;
    width: 36px; height: 36px;
    margin: -18px 0 0 -18px;
    pointer-events: none;
    border: 1px solid rgba(47,52,50,.4);
    box-shadow: 0 3px 10px rgba(47,52,50,.3);
  }
  body.dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
  body.dragging .vbtn { cursor: grabbing; }

  .pieces {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 12px;
  }
  .piece {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 12px 12px 14px;
  }
  .piece[data-fill="yuandian"] { box-shadow: inset 0 3px 0 var(--v-yuandian); }
  .piece[data-fill="nuolan"]   { box-shadow: inset 0 3px 0 var(--v-nuolan); }
  .p-no { font-size: 15px; font-weight: 600; }
  .p-desc { margin-top: 6px; font-size: 13px; line-height: 1.45; }
  .p-val { margin-top: 10px; font-size: 12.5px; color: var(--sage); }
  .piece[data-filled="yes"] .p-val { color: var(--ink); }

  .marks { position: absolute; inset: 0; pointer-events: none; }
  .mark {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(243,244,241,.92);
    border: 1px solid rgba(47,52,50,.35);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    line-height: 20px;
    text-align: center;
  }
  .mark[data-role="structure"] {
    background: rgba(243,244,241,.55);
    color: var(--body);
    font-weight: 500;
  }
  .s-val  { text-align: right; font-size: 12.5px; color: var(--sage); white-space: nowrap; }
  .slots tr[data-filled="yes"] .s-val { color: var(--ink); }
  .s-x {
    border: 0; background: none; cursor: pointer;
    font-size: 13px; color: var(--sage); padding: 0 0 0 6px;
  }
  .s-x:hover { color: var(--ink); }

  .fixed {
    margin-top: 14px;
    text-align: center;
    font-size: 12.5px;
    color: var(--sage);
  }

  .tools { margin-top: 14px; display: flex; gap: 10px; align-items: center; justify-content: center; }
  .btn {
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    background: none;
    border: 1px solid var(--sage);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .count { font-size: 12.5px; color: var(--sage); }

  .note {
    margin-top: 26px;
    padding-top: 12px;
    border-top: 1px solid var(--sand);
    font-size: 12px;
    color: var(--sage);
  }

  @media (max-width: 860px) {
    body { padding: 20px 16px 32px; }
    .stage, .board-foot { max-width: 300px; }
    .pieces { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>拖拽拼装特洛伊木马</h1>
    <p class="sub">网页交互 · 把不同版本的样式混进同一匹马</p>
  </header>

  <div class="main">

    <div class="board">
      <div class="stage" id="stage"></div>
      <div class="board-foot">
        <span>8 块 · 6 个槽位</span>
        <span id="progress">0 / 6</span>
      </div>
    </div>

    <div class="tray">
      <p class="tip">把色块拖到马上的数字上。也可以先点一个版本，再点那一块。</p>
      <div class="versions" id="versions"></div>
    </div>

    <div class="pieces" id="slots"></div>
    <p class="fixed">7 · 8　仅结构</p>
    <div class="tools">
      <button type="button" class="btn" id="clear">清空</button>
      <span class="count" id="count">已放 0 个</span>
    </div>
  </div>

  <p class="note">颜色为占位，素材未定。</p>

</div>

const VERSIONS = [
  { key: "yuandian", name: "原典" },
  { key: "nuolan",   name: "诺兰" }
];

const SLOTS = [
  { i: 1, desc: "人物形象和性格（主角、重要配角）" },
  { i: 2, desc: "艺术表达风格与作品整体氛围" },
  { i: 3, desc: "主要冲突与高光情节" },
  { i: 4, desc: "中心思想与主旨" },
  { i: 5, desc: "最终的结局 / 结果" },
  { i: 6, desc: "作品表现形式（电影、文字、书籍、音乐剧等）" }
];
const MARKS = [
  { i: 1, x: 57.6, y: 23.8 },
  { i: 2, x: 51.0, y: 16.0 },
  { i: 3, x: 55.5, y: 40.8 },
  { i: 4, x: 54.6, y: 54.1 },
  { i: 4, x: 16.6, y: 51.3 },
  { i: 5, x: 8.2,  y: 73.0 },
  { i: 6, x: 34.8, y: 53.3 },
  { i: 7, x: 79.1, y: 57.5 },
  { i: 8, x: 23.6, y: 74.8 }
];
const STRUCTURE = [7, 8];

const nameOf = k => (VERSIONS.find(v => v.key === k) || {}).name || "";

let picked = null;              // 当前选中的版本
const filled = {};              // 槽位 -> 版本
const partEls = {};

const stage    = document.getElementById("stage");
const versionsEl = document.getElementById("versions");
const slotsEl  = document.getElementById("slots");

/* ---- 按形状判断点到了哪一块 ---- */

let regionCtx = null;
const regionImg = new Image();
regionImg.onload = () => {
  const c = document.createElement("canvas");
  c.width = NATURAL.w;
  c.height = NATURAL.h;
  regionCtx = c.getContext("2d", { willReadFrequently: true });
  regionCtx.drawImage(regionImg, 0, 0);
};
regionImg.src = REGIONMAP_SRC;

function regionAt(clientX, clientY) {
  if (!regionCtx) return 0;
  const r = stage.getBoundingClientRect();
  if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) return 0;
  const x = Math.floor((clientX - r.left) / r.width  * NATURAL.w);
  const y = Math.floor((clientY - r.top)  / r.height * NATURAL.h);
  const d = regionCtx.getImageData(x, y, 1, 1).data;
  return d[3] > 8 ? d[0] : 0;
}
const isSlot = i => i >= 1 && i <= 6;

/* ---- 构建 ---- */

function buildStage() {
  [1,2,3,4,5,6,7,8].forEach(i => {
    const el = document.createElement("div");
    el.className = "part";
    el.dataset.part = i;
    const mask = `url("assets/masks/mask_${i}.png")`;
    el.style.webkitMaskImage = mask;
    el.style.maskImage = mask;
    el.style.setProperty("--art", `url("assets/masks/art_${i}.png")`);
    if (STRUCTURE.includes(i)) {
      el.dataset.role = "structure";
      el.style.backgroundImage = `url("assets/masks/art_${i}.png")`;
    } else {
      el.dataset.state = "empty";
    }
    stage.appendChild(el);
    partEls[i] = el;
  });
  const seams = document.createElement("div");
  seams.className = "seams";
  stage.appendChild(seams);

  const layer = document.createElement("div");
  layer.className = "marks";
  MARKS.forEach(m => {
    const s = document.createElement("span");
    s.className = "mark";
    if (STRUCTURE.includes(m.i)) s.dataset.role = "structure";
    s.style.left = m.x + "%";
    s.style.top = m.y + "%";
    s.textContent = m.i;
    layer.appendChild(s);
  });
  stage.appendChild(layer);
}

function buildVersions() {
  versionsEl.innerHTML = "";
  VERSIONS.forEach(v => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "vbtn";
    b.dataset.key = v.key;
    b.setAttribute("aria-pressed", picked === v.key ? "true" : "false");
    b.innerHTML = `<span class="vdot tex-${v.key}"></span><span>${v.name}</span>`;
    versionsEl.appendChild(b);
  });
}

function buildSlots() {
  slotsEl.innerHTML = "";
  SLOTS.forEach(s => {
    const v = filled[s.i];
    const el = document.createElement("article");
    el.className = "piece";
    el.dataset.filled = v ? "yes" : "no";
    if (v) el.dataset.fill = v;
    el.innerHTML =
      `<div class="p-no">${s.i}</div>` +
      `<p class="p-desc">${s.desc}</p>` +
      `<p class="p-val">${v ? nameOf(v) : "—"}` +
      (v ? `<button class="s-x" type="button" data-x="${s.i}" aria-label="移除">×</button>` : "") +
      `</p>`;
    slotsEl.appendChild(el);
  });
}

/* ---- 状态 ---- */

function put(i, key) {
  filled[i] = key;
  const el = partEls[i];
  el.dataset.state = "filled";
  el.dataset.fill = key;
  el.style.backgroundImage = "";
  VERSIONS.forEach(v => el.classList.toggle("tex-" + v.key, v.key === key));
  render();
}

function take(i) {
  delete filled[i];
  const el = partEls[i];
  el.dataset.state = "empty";
  delete el.dataset.fill;
  el.style.backgroundImage = "";
  VERSIONS.forEach(v => el.classList.remove("tex-" + v.key));
  render();
}

function render() {
  buildSlots();
  const n = SLOTS.filter(s => filled[s.i]).length;
  document.getElementById("progress").textContent = `${n} / 6`;
  document.getElementById("count").textContent = `已放 ${n} 个`;
}

/* ---- 交互 ---- */

let hovered = 0;
function hover(i) {
  if (hovered && partEls[hovered]) partEls[hovered].classList.remove("hover");
  hovered = isSlot(i) ? i : 0;
  if (hovered) partEls[hovered].classList.add("hover");
}

stage.addEventListener("mousemove", e => hover(picked ? regionAt(e.clientX, e.clientY) : 0));
stage.addEventListener("mouseleave", () => hover(0));

stage.addEventListener("click", e => {
  const i = regionAt(e.clientX, e.clientY);
  if (!isSlot(i)) return;
  if (picked) put(i, picked);
  else if (filled[i]) take(i);
});

/* 拖拽：按住色块拖到马身上放下 */

let drag = null;
let swallowClick = false;

versionsEl.addEventListener("pointerdown", e => {
  const b = e.target.closest(".vbtn");
  if (!b || e.button > 0) return;
  e.preventDefault();
  drag = { key: b.dataset.key, x: e.clientX, y: e.clientY, ghost: null };
  versionsEl.setPointerCapture(e.pointerId);
});

versionsEl.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) {
    drag.ghost = document.createElement("div");
    drag.ghost.className = "ghost tex-" + drag.key;
    document.body.appendChild(drag.ghost);
    document.body.classList.add("dragging");
  }
  if (drag.ghost) {
    drag.ghost.style.left = e.clientX + "px";
    drag.ghost.style.top  = e.clientY + "px";
    hover(regionAt(e.clientX, e.clientY));
  }
});

function endDrag(e, drop) {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.ghost) {
    d.ghost.remove();
    document.body.classList.remove("dragging");
    hover(0);
    if (drop) {
      const i = regionAt(e.clientX, e.clientY);
      if (isSlot(i)) put(i, d.key);
    }
  } else if (drop) {
    picked = picked === d.key ? null : d.key;
    buildVersions();
  }
  swallowClick = true;
  setTimeout(() => { swallowClick = false; }, 0);
}

versionsEl.addEventListener("pointerup", e => endDrag(e, true));
versionsEl.addEventListener("pointercancel", e => endDrag(e, false));

/* 键盘 / 辅助访问仍然走 click */
versionsEl.addEventListener("click", e => {
  if (swallowClick) return;
  const b = e.target.closest(".vbtn");
  if (!b) return;
  picked = picked === b.dataset.key ? null : b.dataset.key;
  buildVersions();
});

slotsEl.addEventListener("click", e => {
  const b = e.target.closest("[data-x]");
  if (b) take(Number(b.dataset.x));
});

document.getElementById("clear").addEventListener("click", () => {
  SLOTS.forEach(s => { if (filled[s.i]) take(s.i); });
});

buildStage();
buildVersions();
render();
</script>
