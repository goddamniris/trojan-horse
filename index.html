<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>木马</title>
<script>
  try {
    if (sessionStorage.getItem("open-book") === "1" && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("opening");
    }
  } catch (err) {}
</script>
<style>
  :root {
    --bone: #f3e6d2;
    --bone-deep: #6b4e38;
    --field: #f6ead8;
    --earth: #3d332c;
    --ink: #2c241c;
    --ochre: #9a7040;
    --clay: #8a5344;
    --ochre-soft: #c4a36a;
    --clay-soft: #c48978;
    --v-yuandian: var(--ochre);
    --v-nuolan: var(--clay);
    --inkline: var(--ink);
    --ease-out: cubic-bezier(.22, .72, .18, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }
  html.opening { overflow-x: hidden; }
  html.opening body {
    perspective: 2200px;
    perspective-origin: 8% 46%;
  }
  html.opening .wrap {
    transform-origin: left center;
    transform: rotateY(64deg);
    opacity: 0.7;
    will-change: transform;
  }

  body {
    min-height: 100%;
    background-color: #5c4030;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    padding: clamp(16px, 4vw, 48px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body.is-busy { cursor: wait; }

  .page-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: min(1180px, 100%);
    padding: clamp(16px, 2.6vw, 26px);
    background: var(--bone);
    border: 1px solid var(--ink);
    border-radius: 0;
    box-shadow:
      0 0 0 6px rgba(122, 91, 62, 0.18),
      0 18px 40px rgba(48, 32, 18, 0.16);
  }
  .slab-marks {
    position: absolute;
    inset: 7px;
    pointer-events: none;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'><path d='M0-7 1.1-1.1 7 0 1.1 1.1 0 7-1.1 1.1-7 0-1.1-1.1Z' fill='%237a5b3e'/></svg>") 0 0 / 12px 12px no-repeat,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'><path d='M0-7 1.1-1.1 7 0 1.1 1.1 0 7-1.1 1.1-7 0-1.1-1.1Z' fill='%237a5b3e'/></svg>") 100% 0 / 12px 12px no-repeat,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'><path d='M0-7 1.1-1.1 7 0 1.1 1.1 0 7-1.1 1.1-7 0-1.1-1.1Z' fill='%237a5b3e'/></svg>") 0 100% / 12px 12px no-repeat,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'><path d='M0-7 1.1-1.1 7 0 1.1 1.1 0 7-1.1 1.1-7 0-1.1-1.1Z' fill='%237a5b3e'/></svg>") 100% 100% / 12px 12px no-repeat;
    opacity: 0.65;
  }

  .bench {
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2.5vw, 22px);
  }

  .horse-zone { display: flex; flex-direction: column; align-items: stretch; gap: 12px; min-width: 0; }

  .board {
    width: 100%;
    position: relative;
    padding: 18px 18px 14px;
    background: var(--field);
    border: 1px solid var(--ink);
    box-shadow: none;
    transition: transform .28s var(--ease-out);
  }
  .board.reject { animation: board-nudge .42s ease; }
  @keyframes board-nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .ticks {
    position: absolute;
    inset: 5px;
    pointer-events: none;
    opacity: 0.5;
    background:
      linear-gradient(var(--ink), var(--ink)) 0 0 / 12px 1px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 0 0 / 1px 12px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 100% 0 / 12px 1px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 100% 0 / 1px 12px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 0 100% / 12px 1px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 0 100% / 1px 12px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 100% 100% / 12px 1px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 100% 100% / 1px 12px no-repeat;
  }
  .frieze {
    height: 16px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='42' height='16' viewBox='0 0 42 16'><path d='M21 14C21 14 17 6 21 2C25 6 21 14 21 14M21 12C15 8 13 4 15 2M21 12C27 8 29 4 27 2' fill='none' stroke='%236b5344' stroke-width='1.1'/></svg>") center / 42px 16px repeat-x;
  }

  .stage {
    position: relative;
    isolation: isolate;
    width: 100%;
    margin: 0 auto;
    aspect-ratio: 649 / 916;
    touch-action: none;
    border-radius: 2px;
    outline: 2px solid transparent;
    outline-offset: 4px;
    transition: outline-color .2s ease, box-shadow .2s ease;
  }
  .stage.target-ok {
    outline-color: rgba(28, 36, 34, 0.45);
    box-shadow: none;
  }
  .stage.target-no { outline-color: rgba(42, 40, 38, 0.2); }
  .stage.can-lift { cursor: pointer; }

  .part {
    position: absolute;
    inset: 0;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    image-rendering: auto;
    transition: filter .2s ease, opacity .2s ease;
  }
  .part[data-role="structure"] { opacity: .88; }
  .part.hover {
    filter: brightness(1.12) saturate(1.05);
    z-index: 2;
  }
  .part[data-state="filled"].hover {
    filter: brightness(1.08);
    outline: 1px dashed rgba(42, 40, 38, 0.35);
    outline-offset: -2px;
  }
  .part.landed { animation: land 1.05s ease; }
  @keyframes land {
    0% { filter: brightness(1.45); }
    100% { filter: none; }
  }

  /* 空槽位就是这匹马本身，分块靠接缝看出来。 */
  .part[data-state="empty"] {
    background-color: transparent;
  }

  .tex-yuandian {
    background-color: var(--v-yuandian);
    background-image: none;
  }
  .tex-nuolan {
    background-color: var(--v-nuolan);
    background-image: none;
  }

  .seams-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }
  .slot-hint {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
  }

  .sequence {
    display: flex;
    gap: 6px;
    width: 100%;
    padding: 0 4px;
  }
  .seq-cell {
    flex: 1;
    height: 5px;
    border-radius: 1px;
    background: rgba(42, 40, 38, 0.22);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset;
    opacity: 0.35;
    transform: scaleY(0.85);
    transition: opacity .25s ease, transform .25s var(--ease-out), background-color .25s ease;
  }
  .seq-cell.on {
    opacity: 1;
    transform: scaleY(1);
  }
  .seq-cell.yuandian.on { background: var(--v-yuandian); }
  .seq-cell.nuolan.on { background: var(--v-nuolan); }

  .veil {
    position: fixed;
    inset: 0;
    z-index: 16;
    background: rgba(44, 36, 28, 0);
    backdrop-filter: blur(0);
    -webkit-backdrop-filter: blur(0);
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s ease, background .6s ease, backdrop-filter .6s ease, -webkit-backdrop-filter .6s ease;
  }
  .veil.on {
    opacity: 1;
    pointer-events: auto;
    background: rgba(44, 36, 28, 0.32);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .scroll {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 20;
    width: min(1080px, 92vw);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .scroll:empty { display: none; }
  .scroll-piece { position: relative; height: min(460px, 56vh); }
  .sheet {
    height: 100%;
    overflow: hidden;
    background: var(--field);
    box-shadow: 0 24px 50px rgba(18, 24, 22, 0.38);
    animation: unfurl 2.6s cubic-bezier(.22, .7, .2, 1) both;
  }
  .sheet img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 62%;
    display: block;
  }
  .roll {
    position: absolute;
    top: -10px;
    bottom: -10px;
    width: 18px;
    border-radius: 9px;
    z-index: 2;
    background: linear-gradient(90deg, #3a2a1c, #e6d2b0 40%, #8a6844 50%, #e6d2b0 60%, #3a2a1c);
    box-shadow: 0 8px 16px rgba(48, 32, 18, 0.28);
  }
  .roll-l { left: 0; }
  .roll-r { left: 0; animation: roll-r 2.6s cubic-bezier(.22, .7, .2, 1) both; }
  .shut {
    position: absolute;
    top: -14px;
    right: -14px;
    z-index: 3;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--ink);
    background: var(--field);
    color: var(--ink);
    font: 22px/1 "Songti SC", "STSong", Palatino, serif;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 4px 14px rgba(20, 10, 4, 0.28);
    transition: transform .15s ease, background .15s ease;
  }
  .shut:hover { background: #f8f0e4; transform: scale(1.06); }
  .shut:active { transform: scale(0.96); }
  .shut[hidden] { display: none; }
  .shut:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .scroll.dissolve img { opacity: 0.4; }
  .scroll.broken img { opacity: 0.22; }
  .scroll.noise .sheet { position: relative; }
  .scroll.noise img { opacity: 0.1; }
  .scroll.noise .sheet::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(90deg, #1a1612 0 1px, transparent 1px 3px),
      repeating-linear-gradient(#1a1612 0 1px, transparent 1px 4px);
    opacity: 0.45;
  }
  @keyframes unfurl { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes roll-r { from { left: 0; } to { left: calc(100% - 18px); } }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .roll-r, .part.landed, .veil { animation: none; transition: none; }
  }

  /* 拼块的 z-index 会一直累加，只让它在托盘内部比较，不越过卷轴。 */
  .tray {
    isolation: isolate;
    padding: 12px 12px 14px;
    background: var(--earth);
    border: 1px solid var(--ink);
    box-shadow:
      inset 0 3px 12px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
  }
  .tray.yuandian {
    box-shadow:
      inset 0 3px 12px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      inset 3px 0 0 var(--ochre-soft);
  }
  .tray.nuolan {
    box-shadow:
      inset 0 3px 12px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      inset -3px 0 0 var(--clay-soft);
  }
  .pile {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    height: clamp(220px, 36vh, 420px);
    min-height: 200px;
  }
  .shard {
    position: absolute;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: grab;
    touch-action: none;
    -webkit-appearance: none;
    appearance: none;
    overflow: visible;
    background: transparent;
    filter:
      drop-shadow(0 2px 0 rgba(28, 22, 16, 0.9))
      drop-shadow(0 6px 7px rgba(10, 8, 6, 0.45));
    transform-origin: 50% 50%;
    transition: filter .18s ease;
  }
  .shard.held, .shard.dragging {
    filter:
      drop-shadow(0 3px 0 rgba(28, 22, 16, 0.9))
      drop-shadow(0 18px 18px rgba(10, 8, 6, 0.5));
  }
  .shard-surface {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .shard:focus-visible { outline: 2px solid var(--field); outline-offset: 3px; }
  .shard.held { cursor: grab; }
  .shard.dragging {
    cursor: grabbing;
    will-change: transform;
  }
  body.dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }

  .tray-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 520px) {
    .board { width: 100%; }
    .sequence { gap: 4px; }
    .pile { height: clamp(180px, 32vh, 260px); }
  }
  @media (min-width: 900px) {
    .bench {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(280px, 2.2fr) minmax(180px, 1fr);
      align-items: stretch;
      gap: 14px;
    }
    .tray-row {
      display: contents;
    }
    .tray {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .tray.yuandian { order: 1; }
    .horse-zone { order: 2; min-width: 0; }
    .tray.nuolan { order: 3; }
    .pile { height: clamp(420px, 72vh, 820px); min-height: 420px; }
  }
</style>
</head>
<body>
<img class="page-field" src="assets/field.svg?v=2" alt="" />
<div class="wrap">
  <span class="slab-marks" aria-hidden="true"></span>
  <div class="bench">
    <div class="horse-zone">
      <div class="board" id="board">
        <span class="ticks" aria-hidden="true"></span>
        <div class="stage" id="stage" tabindex="0" role="application" aria-label="木马拼图"></div>
      </div>
      <div class="frieze" aria-hidden="true"></div>
      <div class="sequence" id="sequence" aria-hidden="true"></div>
    </div>
    <div class="tray-row">
      <div class="tray yuandian" data-version="yuandian">
        <div class="pile" id="pileYuandian"></div>
      </div>
      <div class="tray nuolan" data-version="nuolan">
        <div class="pile" id="pileNuolan"></div>
      </div>
    </div>
  </div>
</div>
<div class="veil" id="veil"></div>
<div class="scroll" id="finds"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="assets/masks/cuts.js?v=28"></script>
<script>
const NATURAL = { w: 649, h: 916 };
const ASSET_V = "?v=27";
const REGIONMAP_SRC = "assets/masks/regionmap.png" + ASSET_V;
const CUTS_SRC = "assets/masks/cuts.json" + ASSET_V;
const SLOT_N = 7;

const BEATS = [
  { yuandian: "木马进城，夜色里潜入，胜利以荣耀收束。", nuolan: "进城之后是残酷的战斗，奥德修斯颓废。", file: { yuandian: "情节1_特洛伊_原典_v2.jpg", nuolan: "情节1_特洛伊_改编_v1.jpg" } },
  { yuandian: "十二船，伊斯罗斯，九天风暴，食莲，独眼与 Nobody。", nuolan: "沉重的十二船。中间剥落。独眼夺食，逃脱，惹怒。", file: { yuandian: "情节2_回程1_原典_v2.jpg", nuolan: "情节2_回程1_改编_v4.jpg" } },
  { yuandian: "风袋把船打回去。巨人砸船，只剩一艘。喀耳刻救回被变成猪的人。", nuolan: "剥落。钢铁巨人砸船。变猪，谈判，再变回来。", file: { yuandian: "情节3_回程2_原典_v2.jpg", nuolan: "情节3_回程2_改编_v3.jpg" } },
  { yuandian: "冥界先知。塞壬与蜂蜡。斯库拉吞下六人。", nuolan: "冥界里阿伽门农的亡魂，残酷真相，然后是赎罪的决心。塞壬与斯库拉仍在。", file: { yuandian: "情节4_回程3_原典_v2.jpg", nuolan: "情节4_回程3_改编_v2.jpg" } },
  { yuandian: "赫利俄斯的牛，漂流九天。卡吕普索的七年。费埃克斯人。睡梦中回到伊塔卡。", nuolan: "阿波罗的牛，宙斯发怒。忘忧莲七年。离岛，为救子再回。", file: { yuandian: "情节5_回程4_原典_v3.jpg", nuolan: "情节5_回程4_改编_v2.jpg" } },
  { yuandian: "珀涅罗珀与子守住城邦。乞丐归来，杀死求婚者，团聚成为传奇。", nuolan: "儿子寻父。父子扮成乞丐同归，杀死求婚者。与妻子自我流放，赎罪。", file: { yuandian: "情节6_伊塔卡_原典_v2.jpg", nuolan: "情节6_伊塔卡_改编_v2.jpg" } },
  { yuandian: "尾声：史诗合上。下一次讲述，仍从木马的影子开始。", nuolan: "尾声：壳还在。下一次讲述，会不会还认得这匹马。", file: { yuandian: "情节6_伊塔卡_原典_v2.jpg", nuolan: "情节6_伊塔卡_改编_v2.jpg" } }
];
const CLIPS = [
  "polygon(4% 12%, 96% 0, 100% 82%, 8% 100%)",
  "polygon(0 8%, 92% 0, 100% 70%, 88% 100%, 6% 90%)",
  "polygon(8% 0, 100% 10%, 94% 100%, 0 86%)",
  "polygon(0 18%, 80% 0, 100% 40%, 90% 100%, 10% 88%)"
];

const MARKS = [
  { i: 1, x: 57.6, y: 23.8 },
  { i: 2, x: 51.0, y: 16.0 },
  { i: 3, x: 55.5, y: 40.8 },
  { i: 4, x: 54.6, y: 54.1 },
  { i: 4, x: 16.6, y: 51.3 },
  { i: 5, x: 8.2,  y: 73.0 },
  { i: 6, x: 34.8, y: 53.3 },
  { i: 7, x: 79.1, y: 57.5 },
  { i: 8, x: 23.6, y: 74.8 }
];
const STRUCTURE = [];

const BOXES = {
  1: { x: 208, y: 11, w: 354, h: 356 },
  2: { x: 207, y: 105, w: 298, h: 290 },
  3: { x: 47, y: 356, w: 411, h: 223 },
  4: { x: 343, y: 397, w: 296, h: 377 },
  5: { x: 151, y: 393, w: 152, h: 193 },
  6: { x: 62, y: 555, w: 252, h: 350 },
  7: { x: 9, y: 389, w: 114, h: 515 }
};
const FIT = 112;
const maskImgs = {};
const pieceImgs = {};
let bootDone = false;
function pieceSrc(slot, key) {
  return "assets/masks/piece_" + key + "_" + slot + ".png" + ASSET_V;
}
function frameSrc(slot) {
  return "assets/masks/frame_" + slot + ".png" + ASSET_V;
}
function onMaskLoad() {
  if (!bootDone || document.body.classList.contains("dragging")) return;
  renderPile();
}
for (let slot = 1; slot <= SLOT_N; slot++) {
  const img = new Image();
  img.addEventListener("load", onMaskLoad);
  img.src = "assets/masks/mask_" + slot + ".png" + ASSET_V;
  maskImgs[slot] = img;
}
["yuandian", "nuolan"].forEach(key => {
  for (let slot = 1; slot <= SLOT_N; slot++) {
    const img = new Image();
    img.addEventListener("load", onMaskLoad);
    img.src = pieceSrc(slot, key);
    pieceImgs[key + "_" + slot] = img;
  }
});

function shardColor(key) {
  return key === "yuandian" ? "#e2a04a" : "#3c7f86";
}

function drawShardSurface(canvas, piece) {
  const w = canvas.width;
  const h = canvas.height;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  ctx.clearRect(0, 0, w, h);
  const box = BOXES[piece.slot];
  const scale = w / box.w;
  const pimg = pieceImgs[piece.key + "_" + piece.slot];
  if (pimg && pimg.naturalWidth) {
    ctx.drawImage(pimg, -box.x * scale, -box.y * scale, NATURAL.w * scale, NATURAL.h * scale);
    return;
  }
  const img = maskImgs[piece.slot];
  if (img && img.naturalWidth) {
    ctx.drawImage(img, -box.x * scale, -box.y * scale, NATURAL.w * scale, NATURAL.h * scale);
    ctx.globalCompositeOperation = "source-in";
    ctx.fillStyle = shardColor(piece.key);
    ctx.fillRect(0, 0, w, h);
  } else {
    ctx.fillStyle = shardColor(piece.key);
    ctx.fillRect(0, 0, w, h);
  }
}

function mountShardSurface(btn, piece) {
  // 按棋盘比例出图，拖到马身上放大时不糊。
  const box = BOXES[piece.slot];
  const res = Math.max(piece.scale, boardScale()) * (window.devicePixelRatio || 1);
  const w = Math.max(2, Math.round(box.w * res));
  const h = Math.max(2, Math.round(box.h * res));
  const canvas = document.createElement("canvas");
  canvas.className = "shard-surface";
  canvas.width = w;
  canvas.height = h;
  btn.replaceChildren(canvas);
  const paint = () => drawShardSurface(canvas, piece);
  paint();
  const pimg = pieceImgs[piece.key + "_" + piece.slot];
  const mimg = maskImgs[piece.slot];
  if (pimg && !pimg.naturalWidth) pimg.addEventListener("load", paint);
  else if (mimg && !mimg.naturalWidth) mimg.addEventListener("load", paint);
}

let held = null;
let busy = false;
let zTop = 12;
let pendingTier = null;
const filled = {};
const order = [];
const partEls = {};
let shards = [];

const stage = document.getElementById("stage");
const boardEl = document.getElementById("board");
const piles = {
  yuandian: document.getElementById("pileYuandian"),
  nuolan: document.getElementById("pileNuolan")
};
const sequence = document.getElementById("sequence");

function pileFor(key) {
  return piles[key] || piles.yuandian;
}

function allShardEls() {
  return [...piles.yuandian.querySelectorAll(".shard"), ...piles.nuolan.querySelectorAll(".shard")];
}

function buildSequence() {
  sequence.replaceChildren();
  for (let n = 0; n < SLOT_N; n++) {
    const cell = document.createElement("span");
    cell.className = "seq-cell";
    sequence.appendChild(cell);
  }
}

function updateSequence() {
  [...sequence.children].forEach((cell, n) => {
    cell.className = "seq-cell";
    if (n < order.length) cell.classList.add("on", order[n].key);
  });
}

function setBusyState(on) {
  busy = on;
  document.body.classList.toggle("is-busy", on);
}

function rejectBoard() {
  boardEl.classList.remove("reject");
  void boardEl.offsetWidth;
  boardEl.classList.add("reject");
  window.setTimeout(() => boardEl.classList.remove("reject"), 450);
}

let regionCtx = null;
const regionImg = new Image();
let regionLabels = null;
regionImg.onload = () => {
  const c = document.createElement("canvas");
  c.width = NATURAL.w;
  c.height = NATURAL.h;
  regionCtx = c.getContext("2d", { willReadFrequently: true });
  regionCtx.drawImage(regionImg, 0, 0);
  const data = regionCtx.getImageData(0, 0, NATURAL.w, NATURAL.h).data;
  regionLabels = new Uint8Array(NATURAL.w * NATURAL.h);
  for (let i = 0; i < regionLabels.length; i++) {
    regionLabels[i] = data[i * 4 + 3] > 8 ? data[i * 4] : 0;
  }
};
regionImg.src = REGIONMAP_SRC;

function regionAt(clientX, clientY, stageRect) {
  if (!regionLabels) return 0;
  const r = stageRect || stage.getBoundingClientRect();
  if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) return 0;
  const x = Math.floor((clientX - r.left) / r.width * NATURAL.w);
  const y = Math.floor((clientY - r.top) / r.height * NATURAL.h);
  if (x < 0 || y < 0 || x >= NATURAL.w || y >= NATURAL.h) return 0;
  return regionLabels[y * NATURAL.w + x];
}
const isSlot = i => i >= 1 && i <= SLOT_N;

function stillURL(beat, key) {
  return encodeURI("stills/" + BEATS[beat].file[key]);
}
function endingFor(n) {
  if (n === SLOT_N) return { tier: "intact", line: "壁画连成一条归途。下一个读到的，仍是完整的史诗。" };
  if (n >= 5) return { tier: "seams", line: "接缝露出来了。故事还在，只是不再严丝合缝。" };
  if (n === 3 || n === 4) return { tier: "dissolve", line: "壁画开始溶解。归途还在墙上，已经对不齐。" };
  if (n >= 1) return { tier: "broken", line: "原典的结构所剩很少。后来的人很难从这面墙上读回荷马。" };
  return { tier: "noise", line: "墙上只剩噪声。壳还在，这一次传下去的讲述已经换掉。" };
}

let cutsData = null;
let seamsCanvas = null;
let hintCanvas = null;
let hintState = "";
let hintTween = null;
const SEAT_RATIO = 0.4;

function buildStage() {
  Array.from({ length: SLOT_N }, (_, k) => k + 1).forEach(i => {
    const el = document.createElement("div");
    el.className = "part";
    el.dataset.part = i;
    // 拼块/空槽 PNG 自带柔边透明，不再套一层 CSS mask（会把柔边裁成硬齿）。
    el.style.webkitMaskImage = "none";
    el.style.maskImage = "none";
    // 空槽填充由矢量 canvas 绘制，避免 PNG 像素阶梯外沿
    el.style.backgroundImage = "none";
    el.style.backgroundSize = "100% 100%";
    el.style.backgroundRepeat = "no-repeat";
    el.dataset.state = "empty";
    stage.appendChild(el);
    partEls[i] = el;
  });
  seamsCanvas = document.createElement("canvas");
  seamsCanvas.className = "seams-canvas";
  seamsCanvas.setAttribute("aria-hidden", "true");
  hintCanvas = document.createElement("canvas");
  hintCanvas.className = "slot-hint";
  hintCanvas.setAttribute("aria-hidden", "true");
  stage.appendChild(hintCanvas);
  stage.appendChild(seamsCanvas);
  paintSeams();
}

function paintSeams() {
  if (!seamsCanvas || !cutsData) return;
  const r = stage.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.round(r.width * dpr);
  const h = Math.round(r.height * dpr);
  if (seamsCanvas.width !== w || seamsCanvas.height !== h) {
    seamsCanvas.width = w;
    seamsCanvas.height = h;
  }
  const ctx = seamsCanvas.getContext("2d");
  if (!ctx) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const sx = w / cutsData.W;
  const sy = h / cutsData.H;
  // 填充 + 描边共用同一套平滑区域轮廓，避免填描错位造成假锯齿/细缝
  const regions = cutsData.regions || {};
  ctx.fillStyle = "rgba(138, 116, 88, 0.46)";
  for (let i = 1; i <= SLOT_N; i++) {
    if (filled[i]) continue;
    (regions[String(i)] || []).forEach(pts => {
      if (traceSmooth(ctx, pts, sx, sy, true)) ctx.fill();
    });
  }
  const lw = Math.max(1.35 * dpr, (cutsData.stroke || 3.2) * sx * 0.55);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(44, 36, 28, 0.92)";
  ctx.lineWidth = lw;
  for (let i = 1; i <= SLOT_N; i++) {
    (regions[String(i)] || []).forEach(pts => {
      if (traceSmooth(ctx, pts, sx, sy, true)) ctx.stroke();
    });
  }
}

function traceSmooth(ctx, pts, sx, sy, closed) {
  if (!pts || pts.length < 2) return false;
  const xs = pts.map(p => p[0] * sx);
  const ys = pts.map(p => p[1] * sy);
  const n = xs.length;
  ctx.beginPath();
  if (!closed || n < 3) {
    ctx.moveTo(xs[0], ys[0]);
    for (let i = 1; i < n - 1; i++) {
      ctx.quadraticCurveTo(xs[i], ys[i], (xs[i] + xs[i + 1]) / 2, (ys[i] + ys[i + 1]) / 2);
    }
    ctx.lineTo(xs[n - 1], ys[n - 1]);
  } else {
    ctx.moveTo((xs[n - 1] + xs[0]) / 2, (ys[n - 1] + ys[0]) / 2);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      ctx.quadraticCurveTo(xs[i], ys[i], (xs[i] + xs[j]) / 2, (ys[i] + ys[j]) / 2);
    }
    ctx.closePath();
  }
  return true;
}

function motionOk() {
  return !!(window.gsap && !window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}

function drawSlotHint(slot, key) {
  if (!hintCanvas || !cutsData) return;
  const r = stage.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.round(r.width * dpr);
  const h = Math.round(r.height * dpr);
  if (hintCanvas.width !== w || hintCanvas.height !== h) {
    hintCanvas.width = w;
    hintCanvas.height = h;
  }
  const ctx = hintCanvas.getContext("2d");
  if (!ctx) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const sx = w / cutsData.W;
  const sy = h / cutsData.H;
  const color = key === "yuandian" ? "rgba(154, 112, 64, 0.95)" : "rgba(138, 83, 68, 0.95)";
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(16 * dpr, 18);
  (cutsData.regions[String(slot)] || []).forEach(pts => {
    if (!traceSmooth(ctx, pts, sx, sy, true)) return;
    ctx.fill();
    ctx.stroke();
  });
}

function showSlotHint(slot, key) {
  const id = slot + ":" + key;
  if (hintState === id) return;
  hintState = id;
  drawSlotHint(slot, key);
  hintCanvas.style.willChange = "opacity";
  if (!motionOk()) {
    hintCanvas.style.opacity = "0.72";
    return;
  }
  if (hintTween) hintTween.kill();
  hintTween = gsap.fromTo(hintCanvas, { opacity: 0.38 }, {
    opacity: 0.78,
    duration: 0.68,
    ease: "sine.inOut",
    yoyo: true,
    repeat: -1
  });
}

function hideSlotHint() {
  if (!hintState) return;
  hintState = "";
  if (hintTween) { hintTween.kill(); hintTween = null; }
  if (!window.gsap) {
    hintCanvas.style.opacity = "0";
    hintCanvas.style.willChange = "auto";
    return;
  }
  gsap.killTweensOf(hintCanvas);
  gsap.to(hintCanvas, {
    opacity: 0,
    duration: motionOk() ? 0.22 : 0,
    ease: "power1.out",
    onComplete: () => { hintCanvas.style.willChange = "auto"; }
  });
}

function flashSlot(slot, key) {
  hintState = "";
  if (hintTween) { hintTween.kill(); hintTween = null; }
  drawSlotHint(slot, key);
  if (!motionOk()) {
    hintCanvas.style.opacity = "0";
    hintCanvas.style.willChange = "auto";
    return;
  }
  hintCanvas.style.willChange = "opacity";
  gsap.killTweensOf(hintCanvas);
  gsap.fromTo(hintCanvas, { opacity: 0.85 }, {
    opacity: 0,
    duration: 0.62,
    ease: "power2.out",
    onComplete: () => { hintCanvas.style.willChange = "auto"; }
  });
}

function snapToContour(el, seat) {
  const k = boardScale();
  const x = seat ? seat.ox * k : 0;
  const y = seat ? seat.oy * k : 0;
  if (!motionOk() || (Math.abs(x) < 0.6 && Math.abs(y) < 0.6)) return;
  el.style.willChange = "transform";
  gsap.killTweensOf(el);
  gsap.fromTo(el, { x: x, y: y }, {
    x: 0,
    y: 0,
    duration: 0.48,
    ease: "power3.out",
    onComplete: () => {
      el.style.willChange = "auto";
      gsap.set(el, { clearProps: "transform" });
    }
  });
}

function applySeat(el, piece) {
  const k = boardScale();
  el.style.backgroundPosition = ((piece.ox || 0) * k) + "px " + ((piece.oy || 0) * k) + "px";
}

function syncSeats() {
  for (let i = 1; i <= SLOT_N; i++) {
    if (!filled[i] || !partEls[i]) continue;
    const piece = shards.find(s => s.slot === i && s.placed);
    if (piece) applySeat(partEls[i], piece);
  }
  if (hintState) {
    const parts = hintState.split(":");
    drawSlotHint(Number(parts[0]), parts[1]);
  }
}

// 不透明像素有多少落在自己的框里。框是不规则的，不能只看外接矩形中心。
function cacheAlpha(btn) {
  const canvas = btn.firstElementChild;
  if (!canvas || btn._alpha) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  let data = null;
  try { data = ctx.getImageData(0, 0, canvas.width, canvas.height).data; } catch (err) { return; }
  const n = 7;
  const cells = new Array(n * n);
  for (let iy = 0; iy < n; iy++) {
    for (let ix = 0; ix < n; ix++) {
      const px = Math.min(canvas.width - 1, Math.floor((ix + 0.5) / n * canvas.width));
      const py = Math.min(canvas.height - 1, Math.floor((iy + 0.5) / n * canvas.height));
      cells[iy * n + ix] = data[(py * canvas.width + px) * 4 + 3] > 24;
    }
  }
  btn._alpha = cells;
}

function coverRatio(btn, piece) {
  const cells = btn._alpha;
  const r = btn.getBoundingClientRect();
  const stageR = stage.getBoundingClientRect();
  if (!cells || r.width < 2 || r.height < 2) return 0;
  const n = 7;
  let hit = 0;
  let tot = 0;
  for (let i = 0; i < cells.length; i++) {
    if (!cells[i]) continue;
    tot++;
    const ix = i % n;
    const iy = (i / n) | 0;
    const x = r.left + (ix + 0.5) / n * r.width;
    const y = r.top + (iy + 0.5) / n * r.height;
    if (regionAt(x, y, stageR) === piece.slot) hit++;
  }
  return tot ? hit / tot : 0;
}

function seatOffset(btn, piece) {
  const stageR = stage.getBoundingClientRect();
  const br = btn.getBoundingClientRect();
  const k = stageR.width / NATURAL.w;
  const box = BOXES[piece.slot];
  return {
    ox: ((br.left - stageR.left) - box.x * k) / k,
    oy: ((br.top - stageR.top) - box.y * k) / k
  };
}

function syncSeatHint(piece, btn) {
  if (filled[piece.slot] || coverRatio(btn, piece) < SEAT_RATIO) hideSlotHint();
  else showSlotHint(piece.slot, piece.key);
}

function scatter() {
  const items = [];
  for (let slot = 1; slot <= SLOT_N; slot++) {
    items.push({ slot, key: "yuandian" });
    items.push({ slot, key: "nuolan" });
  }
  // 同侧内部打乱，左右版本不混。
  ["yuandian", "nuolan"].forEach(key => {
    const side = items.filter(item => item.key === key);
    for (let i = side.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = side[i]; side[i] = side[j]; side[j] = t;
    }
    side.forEach((item, n) => {
      item.rx = Math.min(1, Math.max(0, 0.5 + (Math.random() - 0.5) * 0.7));
      item.ry = Math.min(1, Math.max(0, (n + 0.5) / side.length + (Math.random() - 0.5) * 0.08));
    });
  });
  shards = items.map((item, id) => ({
    id, slot: item.slot, key: item.key, placed: false,
    rx: item.rx, ry: item.ry,
    rot: Math.random() * 50 - 25,
    z: id + 1
  }));
  zTop = shards.length;
}

function pose(btn, piece) {
  const rot = held === piece.id ? 0 : piece.rot;
  const sc = held === piece.id ? 1.06 : 1;
  btn.style.transform = "rotate(" + rot + "deg) scale(" + sc + ")";
}

function raise(btn, piece) {
  piece.z = ++zTop;
  btn.style.zIndex = String(piece.z);
  btn.style.transform = "rotate(0deg) scale(1.08)";
}

function boardScale() {
  const w = stage.getBoundingClientRect().width;
  return w > 0 ? w / NATURAL.w : 1;
}

// 所有残片共用一个比例，大小关系与马身一致。
function pileScale(w, h) {
  let maxW = 0, maxH = 0;
  Object.values(BOXES).forEach(b => {
    maxW = Math.max(maxW, b.w);
    maxH = Math.max(maxH, b.h);
  });
  return Math.min(boardScale() * 0.62, (w * 0.98) / maxW, (h * 0.55) / maxH);
}

function metricsFor(piece, scale) {
  const box = BOXES[piece.slot];
  return {
    dw: box.w * scale,
    dh: box.h * scale,
    scale
  };
}

function measurePile(pileEl) {
  const tray = pileEl.parentElement;
  const rect = pileEl.getBoundingClientRect();
  let w = rect.width || pileEl.clientWidth || (tray ? tray.clientWidth - 24 : 0);
  let h = rect.height || pileEl.clientHeight;
  if (w < 48) w = tray ? Math.max(160, tray.clientWidth - 24) : 200;
  if (h < 120) h = 360;
  return { w, h };
}

function layoutPile() {
  const scales = {};
  Object.keys(piles).forEach(key => {
    const { w, h } = measurePile(piles[key]);
    scales[key] = { w, h, scale: pileScale(w, h) };
  });
  shards.forEach(piece => {
    if (piece.placed) return;
    const side = scales[piece.key];
    const m = metricsFor(piece, side.scale);
    piece.dw = m.dw;
    piece.dh = m.dh;
    piece.scale = m.scale;
    const slackX = Math.max(0, side.w - m.dw);
    const slackY = Math.max(0, side.h - m.dh);
    piece.px = piece.rx * slackX;
    piece.py = piece.ry * slackY;
  });
}

function renderPile() {
  layoutPile();
  Object.values(piles).forEach(pileEl => pileEl.replaceChildren());
  shards.forEach(piece => {
    if (piece.placed) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "shard " + piece.key + (held === piece.id ? " held" : "");
    btn.style.left = piece.px + "px";
    btn.style.top = piece.py + "px";
    btn.style.width = piece.dw + "px";
    btn.style.height = piece.dh + "px";
    btn.style.zIndex = String(piece.z);
    mountShardSurface(btn, piece);
    btn.setAttribute("aria-pressed", held === piece.id ? "true" : "false");
    btn.setAttribute("aria-label", piece.key === "yuandian" ? "原典残片" : "改编残片");
    pileFor(piece.key).appendChild(btn);
    pose(btn, piece);
    bindShard(btn, piece);
  });
}

function paint(i, key, seat) {
  const el = partEls[i];
  el.dataset.state = "filled";
  el.dataset.fill = key;
  el.style.backgroundImage = `url("${pieceSrc(i, key)}")`;
  el.style.backgroundSize = "100% 100%";
  el.style.backgroundPosition = "0px 0px";
  el.classList.remove("tex-yuandian", "tex-nuolan", "landed");
  paintSeams();
  flashSlot(i, key);
  snapToContour(el, seat);
}

function closeScroll() {
  setBusyState(false);
  pendingTier = null;
  const finds = document.getElementById("finds");
  finds.replaceChildren();
  finds.className = "scroll";
  document.getElementById("veil").classList.remove("on");
}

function reveal(beat, key) {
  const finds = document.getElementById("finds");
  finds.className = "scroll";
  const piece = document.createElement("div");
  piece.className = "scroll-piece";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  const img = document.createElement("img");
  img.src = stillURL(beat, key);
  img.alt = "";
  sheet.appendChild(img);
  const left = document.createElement("i");
  left.className = "roll roll-l";
  const right = document.createElement("i");
  right.className = "roll roll-r";
  const shut = document.createElement("button");
  shut.type = "button";
  shut.className = "shut";
  shut.hidden = true;
  shut.setAttribute("aria-label", "关闭");
  shut.textContent = "×";
  shut.addEventListener("click", closeScroll);
  piece.append(left, sheet, right, shut);
  finds.replaceChildren(piece);
  document.getElementById("veil").classList.add("on");
  let settled = false;
  let settleTimer = 0;
  const finish = () => {
    if (settled || !finds.contains(piece)) return;
    settled = true;
    window.clearTimeout(settleTimer);
    if (pendingTier) finds.classList.add(pendingTier);
    shut.hidden = false;
  };
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) finish();
  else {
    sheet.addEventListener("animationend", finish, { once: true });
    settleTimer = window.setTimeout(finish, 3200);
  }
}

function put(i, piece, seat) {
  if (busy || !isSlot(i) || i !== piece.slot || filled[i] || piece.placed || order.length >= SLOT_N) return;
  piece.placed = true;
  piece.ox = 0;
  piece.oy = 0;
  filled[i] = piece.key;
  order.push({ slot: i, key: piece.key });
  held = null;
  setBusyState(true);
  paint(i, piece.key, seat);
  renderPile();
  updateSequence();
  const beat = order.length - 1;
  const key = piece.key;
  if (order.length === SLOT_N) {
    pendingTier = endingFor(order.filter(item => item.key === "yuandian").length).tier;
  }
  window.setTimeout(() => reveal(beat, key), 1100);
}

let hovered = 0;
function clearPart(i) {
  const el = partEls[i];
  el.dataset.state = "empty";
  delete el.dataset.fill;
  el.style.backgroundImage = "none";
  el.style.backgroundSize = "100% 100%";
  el.style.backgroundPosition = "0px 0px";
  el.classList.remove("tex-yuandian", "tex-nuolan", "landed");
  if (window.gsap) {
    gsap.killTweensOf(el);
    gsap.set(el, { clearProps: "transform" });
  }
  el.style.willChange = "auto";
  paintSeams();
}

function take(i) {
  if (busy || !filled[i]) return;
  const piece = shards.find(s => s.slot === i && s.placed);
  if (!piece) return;
  piece.placed = false;
  piece.ox = 0;
  piece.oy = 0;
  delete filled[i];
  const at = order.findIndex(item => item.slot === i);
  if (at >= 0) order.splice(at, 1);
  held = null;
  clearPart(i);
  renderPile();
  updateSequence();
}

function hover(i) {
  if (hovered && partEls[hovered]) partEls[hovered].classList.remove("hover");
  const piece = held == null ? null : shards.find(s => s.id === held);
  if (piece) hovered = i === piece.slot && !filled[i] ? i : 0;
  else hovered = isSlot(i) && filled[i] ? i : 0;
  if (hovered) partEls[hovered].classList.add("hover");
  syncStageHint(i);
}

function syncStageHint(i) {
  stage.classList.remove("target-ok", "target-no", "can-lift");
  if (busy) return;
  const piece = held == null ? null : shards.find(s => s.id === held);
  if (piece) {
    if (i === piece.slot && !filled[i]) stage.classList.add("target-ok");
    else if (isSlot(i)) stage.classList.add("target-no");
  } else if (isSlot(i) && filled[i]) {
    stage.classList.add("can-lift");
  }
}

stage.addEventListener("mousemove", e => {
  if (busy) { hover(0); return; }
  hover(regionAt(e.clientX, e.clientY));
});
stage.addEventListener("mouseleave", () => hover(0));
stage.addEventListener("click", e => {
  if (busy) return;
  const i = regionAt(e.clientX, e.clientY);
  if (held == null) {
    if (filled[i]) take(i);
    return;
  }
  const piece = shards.find(s => s.id === held);
  if (piece) put(i, piece);
});

// 残片是不规则形状：点到透明处要落到下面那块。
function solidAt(btn, clientX, clientY) {
  const canvas = btn.firstElementChild;
  if (!canvas || !canvas.getContext) return true;
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const piece = shards.find(s => String(s.id) === btn.dataset.id);
  const rad = -((piece && held !== piece.id ? piece.rot : 0) * Math.PI) / 180;
  const dx = clientX - cx;
  const dy = clientY - cy;
  const lx = dx * Math.cos(rad) - dy * Math.sin(rad) + btn.offsetWidth / 2;
  const ly = dx * Math.sin(rad) + dy * Math.cos(rad) + btn.offsetHeight / 2;
  if (lx < 0 || ly < 0 || lx >= btn.offsetWidth || ly >= btn.offsetHeight) return false;
  const px = Math.floor(lx / btn.offsetWidth * canvas.width);
  const py = Math.floor(ly / btn.offsetHeight * canvas.height);
  try {
    return canvas.getContext("2d").getImageData(px, py, 1, 1).data[3] > 24;
  } catch (err) {
    return true;
  }
}

// 不规则块的外接框中心常落在别的区，所以按块本身离槽位多近来吸附。
function snapSlot(piece, centerX, centerY) {
  if (filled[piece.slot]) return 0;
  const r = stage.getBoundingClientRect();
  const k = r.width / NATURAL.w;
  const box = BOXES[piece.slot];
  const sx = r.left + (box.x + box.w / 2) * k;
  const sy = r.top + (box.y + box.h / 2) * k;
  const reach = Math.max(36, Math.min(box.w, box.h) * k * 0.3);
  return Math.hypot(centerX - sx, centerY - sy) <= reach ? piece.slot : 0;
}

function shardUnder(clientX, clientY) {
  return allShardEls()
    .sort((a, b) => Number(b.style.zIndex) - Number(a.style.zIndex))
    .find(el => solidAt(el, clientX, clientY));
}

function bindShard(btn, piece) {
  let start = null;
    btn.dataset.id = String(piece.id);
    btn.dataset.slot = String(piece.slot);
    btn.dataset.key = piece.key;
  const endDrag = () => {
    document.body.classList.remove("dragging");
    btn.classList.remove("dragging");
  };
  // 放大到棋盘比例后，按住的那一点仍留在指针下。
  const centerAt = (clientX, clientY) => {
    const k = boardScale();
    const box = BOXES[piece.slot];
    return {
      x: clientX - (start.fx - 0.5) * box.w * k,
      y: clientY - (start.fy - 0.5) * box.h * k
    };
  };
  const follow = (clientX, clientY) => {
    const c = centerAt(clientX, clientY);
    btn.style.left = (c.x - piece.dw / 2) + "px";
    btn.style.top = (c.y - piece.dh / 2) + "px";
  };
  btn._grab = e => {
    const r = btn.getBoundingClientRect();
    start = {
      x: e.clientX, y: e.clientY, moved: false, floated: false,
      fx: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      fy: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
    };
    raise(btn, piece);
    btn.setPointerCapture(e.pointerId);
  };
  btn.addEventListener("pointerdown", e => {
    if (busy || e.button > 0 || piece.placed) return;
    if (!solidAt(btn, e.clientX, e.clientY)) {
      e.preventDefault();
      const below = shardUnder(e.clientX, e.clientY);
      if (below && below !== btn && below._grab) below._grab(e);
      return;
    }
    btn._grab(e);
  });
  btn.addEventListener("pointermove", e => {
    if (!start) return;
    if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > 6) start.moved = true;
    if (!start.moved) return;
    if (!start.floated) {
      start.floated = true;
      document.body.classList.add("dragging");
      btn.classList.add("dragging");
      document.body.appendChild(btn);
      btn.style.position = "fixed";
      btn.style.zIndex = "14";
      piece.z = ++zTop;
      btn.style.transition = "transform .22s var(--ease-out), filter .18s ease";
      btn.style.transform = "rotate(0deg) scale(" + (boardScale() / piece.scale) + ")";
      cacheAlpha(btn);
      follow(e.clientX, e.clientY);
    }
    if (start.floated) {
      follow(e.clientX, e.clientY);
      syncSeatHint(piece, btn);
    }
  });
  btn.addEventListener("pointerup", e => {
    if (!start) return;
    if (start.floated) follow(e.clientX, e.clientY);
    const moved = start.moved;
    const floated = start.floated;
    const seated = floated && !filled[piece.slot] && coverRatio(btn, piece) >= SEAT_RATIO;
    const seat = seated ? seatOffset(btn, piece) : null;
    start = null;
    endDrag();
    if (!moved) {
      hideSlotHint();
      held = held === piece.id ? null : piece.id;
      renderPile();
      syncStageHint(0);
      return;
    }
    hover(0);
    if (floated) btn.remove();
    if (seated) put(piece.slot, piece, seat);
    else {
      hideSlotHint();
      if (isSlot(regionAt(e.clientX, e.clientY))) rejectBoard();
      renderPile();
    }
  });
  btn.addEventListener("pointercancel", () => {
    start = null;
    endDrag();
    hideSlotHint();
    if (btn.parentElement === document.body) btn.remove();
    renderPile();
    hover(0);
  });
}

function reset() {
  order.length = 0;
  Object.keys(filled).forEach(k => delete filled[k]);
  held = null;
  setBusyState(false);
  pendingTier = null;
  document.getElementById("veil").classList.remove("on");
  Array.from({ length: SLOT_N }, (_, k) => k + 1).forEach(clearPart);
  const finds = document.getElementById("finds");
  finds.replaceChildren();
  finds.className = "scroll";
  scatter();
  renderPile();
  updateSequence();
  syncStageHint(0);
  paintSeams();
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("veil").classList.contains("on")) {
    e.preventDefault();
    closeScroll();
    return;
  }
  if (e.key !== "r" && e.key !== "R") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (!busy) reset();
});

function openFromBook() {
  const root = document.documentElement;
  if (!root.classList.contains("opening")) return;
  try { sessionStorage.removeItem("open-book"); } catch (err) {}
  const wrap = document.querySelector(".wrap");
  if (!wrap || !motionOk()) {
    root.classList.remove("opening");
    return;
  }
  gsap.fromTo(wrap, {
    rotationY: 64,
    opacity: 0.7,
    transformOrigin: "left center"
  }, {
    rotationY: 0,
    opacity: 1,
    duration: 0.85,
    ease: "power3.out",
    onComplete: () => {
      gsap.set(wrap, { clearProps: "transform,opacity" });
      wrap.style.willChange = "auto";
      root.classList.remove("opening");
    }
  });
}

function boot() {
  openFromBook();
  buildSequence();
  buildStage();
  scatter();
  bootDone = true;
  renderPile();
  updateSequence();
  window.requestAnimationFrame(() => {
    paintSeams();
    renderPile();
  });
  if (window.CUTS_DATA) {
    cutsData = window.CUTS_DATA;
    paintSeams();
    return;
  }
  fetch(CUTS_SRC)
    .then(r => r.json())
    .then(data => {
      cutsData = data;
      paintSeams();
    })
    .catch(() => {});
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

window.addEventListener("resize", () => {
  paintSeams();
  syncSeats();
  if (!busy && !document.body.classList.contains("dragging")) renderPile();
});
if (window.ResizeObserver) {
  let pileTimer = 0;
  const pileObserver = new ResizeObserver(() => {
    paintSeams();
    syncSeats();
    if (busy || document.body.classList.contains("dragging")) return;
    window.clearTimeout(pileTimer);
    pileTimer = window.setTimeout(() => {
      if (!busy && !document.body.classList.contains("dragging")) renderPile();
    }, 80);
  });
  Object.values(piles).forEach(pileEl => {
    pileObserver.observe(pileEl);
    if (pileEl.parentElement) pileObserver.observe(pileEl.parentElement);
  });
}
</script>
