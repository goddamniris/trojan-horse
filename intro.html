<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>特洛伊木马</title>
<style>
  :root {
    --bone: #f3e6d2;
    --bone-deep: #6b4e38;
    --field: #f6ead8;
    --earth: #3d332c;
    --ink: #2c241c;
    --ochre: #9a7040;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }

  body {
    min-height: 100dvh;
    background-color: #5c4030;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    padding: clamp(16px, 4vw, 48px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .book {
    position: relative;
    z-index: 1;
    width: min(640px, 100%);
    perspective: 1800px;
  }

  .leaf {
    position: absolute;
    inset: 0;
    background: var(--field);
    border: 1px solid var(--ink);
    box-shadow: 0 18px 40px rgba(48, 32, 18, 0.12);
  }

  .sheet {
    position: relative;
    width: 100%;
    padding: clamp(28px, 5vw, 48px);
    background: var(--bone);
    border: 1px solid var(--ink);
    box-shadow: 0 18px 40px rgba(48, 32, 18, 0.16);
    transform-origin: left center;
    backface-visibility: hidden;
  }

  .sheet.is-turning {
    will-change: transform;
    pointer-events: none;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 28px;
  }

  .date {
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.62;
    white-space: nowrap;
  }

  .lang {
    display: flex;
    justify-content: flex-end;
    gap: 14px;
    flex-shrink: 0;
  }

  .lang button {
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    padding: 4px 0;
    cursor: pointer;
    opacity: 0.45;
  }

  .lang button[aria-pressed="true"] {
    opacity: 1;
    box-shadow: inset 0 -1px 0 var(--ink);
  }

  .lang button:focus-visible {
    outline: 2px solid var(--ochre);
    outline-offset: 3px;
  }

  h1 {
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 560;
    letter-spacing: 0.02em;
    line-height: 1.15;
    margin-bottom: 22px;
  }

  .copy p {
    font-size: 17px;
    line-height: 1.75;
    max-width: 38em;
  }

  .copy p + p { margin-top: 16px; }

  .go {
    display: inline-block;
    margin-top: 32px;
    padding: 12px 22px;
    background: var(--earth);
    color: var(--field);
    text-decoration: none;
    font-size: 16px;
    line-height: 1;
  }

  .go:hover { background: #2a231e; }
  .go:active { transform: translateY(1px); }
  .go:focus-visible {
    outline: 2px solid var(--ochre);
    outline-offset: 3px;
  }
</style>
</head>
<body>
<img class="page-field" src="assets/field.svg?v=2" alt="" />
<div class="book" id="book">
  <div class="leaf" aria-hidden="true"></div>
<main class="sheet" id="sheet">
  <div class="masthead">
    <p class="date" id="date"></p>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>
  <h1 id="title"></h1>
  <div class="copy" id="copy"></div>
  <a class="go" id="go" href="index.html"></a>
</main>
</div>
<link rel="prefetch" href="index.html" />
<script src="assets/vendor/gsap.min.js"></script>
<script>
const COPY = {
  zh: {
    date: "2077年10月14日",
    title: "特洛伊木马",
    doc: "特洛伊木马",
    paragraphs: [
      "尊敬的考古学家，您好。这一批是刚出土的拼图残片。",
      "初步研究认为，它和传说里的特洛伊木马、《奥德赛》里的归途关联很强。外形接近希腊木马形制，内里却是碎的，需要您协助把它们嵌回去。",
      "同一部位往往会留下两套残片，讲法也因此大不一样。希望您按自己的理解选一块；我会在一旁协助您整理故事的走向。",
      "现在，请您开始吧。"
    ],
    go: "开始"
  },
  en: {
    date: "14 October 2077",
    title: "The Trojan horse",
    doc: "The Trojan horse",
    paragraphs: [
      "Dear colleague. These shards just came up from the field.",
      "Early work ties them to the Trojan horse of Greek legend and to the homeward route in the Odyssey. The outline reads as a Greek horse; inside it is broken, and we need your help seating the pieces.",
      "Shards from the same place often arrive in two versions, and the story shifts with which one you choose. Use your own judgment; I will stay with you to keep the narrative in order.",
      "Whenever you are ready."
    ],
    go: "Begin"
  }
};

const dateEl = document.getElementById("date");
const title = document.getElementById("title");
const copy = document.getElementById("copy");
const go = document.getElementById("go");
const sheet = document.getElementById("sheet");
const buttons = [...document.querySelectorAll(".lang button")];

function apply(lang) {
  const text = COPY[lang] || COPY.zh;
  document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
  document.title = text.doc;
  dateEl.textContent = text.date;
  title.textContent = text.title;
  copy.replaceChildren(...text.paragraphs.map(line => {
    const p = document.createElement("p");
    p.textContent = line;
    return p;
  }));
  go.textContent = text.go;
  buttons.forEach(btn => {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
  });
  try { localStorage.setItem("trojan-lang", lang); } catch (err) {}
}

let saved = "zh";
try { saved = localStorage.getItem("trojan-lang") || "zh"; } catch (err) {}
apply(saved === "en" ? "en" : "zh");

buttons.forEach(btn => {
  btn.addEventListener("click", () => apply(btn.dataset.lang));
});

let leaving = false;
go.addEventListener("click", (event) => {
  event.preventDefault();
  if (leaving) return;
  const href = go.getAttribute("href");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !window.gsap) {
    location.href = href;
    return;
  }
  leaving = true;
  sheet.classList.add("is-turning");
  try { sessionStorage.setItem("open-book", "1"); } catch (err) {}
  gsap.to(sheet, {
    rotationY: -112,
    duration: 0.9,
    ease: "power2.in",
    onComplete: () => { location.href = href; }
  });
});

// 按「返回」回到这页时可能来自缓存，停在翻走的那一帧，按钮也失灵，要复原。
window.addEventListener("pageshow", (event) => {
  if (!event.persisted || !leaving) return;
  leaving = false;
  sheet.classList.remove("is-turning");
  if (window.gsap) {
    gsap.killTweensOf(sheet);
    gsap.set(sheet, { clearProps: "transform" });
  }
});
</script>
</body>
</html>
